==========================================================================
 콜 올인원 · v0.9.2 (2026-11-16) · v0.1 2026-10-28
 만든 사람: 이승준 (TS자산관리센터) · 다음 개발: 단장님 (Claude Code)
--------------------------------------------------------------------------
 이 파일 하나로 화면과 흐름이 다 돌아가요. 서버 없이 브라우저 저장소(localStorage)에
 JSON 하나로 저장해요. 실서비스로 갈 때 바꿀 곳은 [TODO-서버] 표시를 찾으면 돼요.

 코드 구성 (script 안 순서)
   1. SEED_PART ...... 초회콜 시트 v35·장표 도구함에서 뽑은 데이터 (고객은 가명 A01~A23)
   2. 기본 데이터 ..... 레벨, AI 고객(페르소나), 금지 멘트 탐지 규칙, 근거 통계, 장표 원칙, 데모 사용자
   3. 저장소 .......... load/save/export/import  [TODO-서버] DB(API)로 교체
   4. 로그인 .......... 데모 PIN                   [TODO-서버] 실제 인증 + 역할 권한
   5. AI 어댑터 ....... Claude API 직접 호출(개발용) [TODO-서버] 서버 프록시로 옮기고 키는 서버에만
   6. 데모 고객 엔진 .. 규칙 기반 고객 (AI 없이도 연습 가능)
   7. 채점 ............ 규칙 루브릭 100점 (통과 판정) + AI 코멘트(보조)
   8. 녹취 분석 ....... 화자 분리, 가림 처리, 자동 점검
   9. 화면 ............ 홈 · 연습 · 실전 콜 · 고객 기록 · 멘트 · 관리자 · 설정
  10. 음성 ............ 브라우저 TTS/STT(크롬)       [TODO] 상용 음성 API로 교체 가능

 데이터 구조 (DB)
   users[], personas[], playbook{flow,reacts,bans,banRules,templates,cases,stages,cardRules,evidence},
   sessions[] (연습), calls[] (실전 콜), customers{userId:{customerKey:{name,memo}}} (실명은 여기에만),
   proposals[] (새 멘트 제안 → 관리자 승인), settings{}

 보안 주의
   - PIN은 데모용이에요. 소스에 다 보이니 실제 고객 정보는 넣지 마세요.
   - API 키는 sessionStorage에만 두고 탭을 닫으면 사라져요. 배포본에 키를 넣지 마세요.
==========================================================================

<style>
:root{--bg:#f5f6f9;--card:#ffffff;--ink:#14203a;--muted:#5d6678;--line:#e2e5eb;--navy:#1a2744;--navy2:#26365c;--gold:#b8892e;--goldsoft:#f6eedb;--red:#c0392b;--redsoft:#fbe9e7;--green:#1f7a4d;--greensoft:#e5f2ea;--blue:#2f5fb3;--bluesoft:#e8eefa;--focus:#b8892e}

:root[data-theme=dark]{--bg:#0f1523;--card:#171f31;--ink:#e7ebf3;--muted:#9ba5b9;--line:#2a3450;--navy:#0b1120;--navy2:#22304e;--gold:#d8ad55;--goldsoft:#2b2617;--red:#ef6c5e;--redsoft:#3a1f1c;--green:#56b884;--greensoft:#17301f;--blue:#7aa2ec;--bluesoft:#1b2840}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.logo,.top .btn{white-space:nowrap}
@media (max-width:600px){.who{display:none}.top .in{padding:8px 12px;gap:8px}}

.logo{font-weight:800;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--gold);font-style:normal;color:var(--navy);text-align:center;line-height:22px;font-size:13px}
.top .sp{flex:1}

.nav button[aria-current=page]{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px}

label.f{display:block;font-size:13px;font-weight:700;margin:0 0 4px}

body{font-size:15px;line-height:1.6;letter-spacing:-.003em}

<script>
'use strict';
const SEED_PART={"playbook": {"flow": [{"n": "1", "title": "인사 · 빠른 공감 (퍼미션)", "sub": "10초 · 허락 묻지 말고, 반응은 한 문장으로 받고 바로 본론", "body": "OOO님 맞으시죠? CJ온스타일 통해 상담 맡게 된 {내회사} {내이름}입니다. 1분만 말씀드릴게요.\n\n• \"기억 안 나요\": 네~ 기억 안 나실 수 있어요, 맞아요. 빠르게 통화가 이뤄져서 그러실 거예요. 그래서 연락드린 건데요, → 쉬지 말고 본론\n• \"보험이에요?\": 네 맞아요, 보험 점검이에요. 그래서 연락드린 건데요, → 본론\n• \"통화 괜찮으세요?\" \"기억하세요?\"는 하지 않기 (일관성: 한 번 한 \"아니요\"는 지키려 함)\n• 전화 5~10분 전에 '사전 문자 · 퍼미션' 먼저"}, {"n": "2", "title": "본론", "sub": "15초 · 내가 고객을 고르는 구도 · 말 끝나자마자 첫 질문", "body": "이게 모든 분께 필요한 건 아니라서, 고객님한테 도움이 될지부터 봐야 하거든요. 들으셔야 하는 부분만 말씀드리고 바로 통화 끝낼게요. 첫 번째요, …\n\n• 왜: 부담을 작게 정해 주면(바로 끝낼게요) 거절할 명분이 줄고, \"모든 분께 필요한 건 아니라서\"는 아무한테나 거는 전화가 아니라는 신호\n• \"빨아들이기\"는 길게 말하는 게 아니라 곧바로 질문을 던지는 것. 혼자 15초 넘기면 판매 신호"}, {"n": "3", "title": "면접자 질문", "sub": "60초 · 하나 묻고 짧게 받고 다음 · 3개까지", "body": "① 실비: 지금 실비가 몇 세대인지 아세요?\n   → 모르면: 세대마다 자기부담금이랑 보험료 오르는 방식이 달라요. 2013년 3월 이전에 든 실비는 이번 달부터 갈아타기 할인이 시행될 예정인데, 바꾸면 손해인 분도 있어요.\n② 나라 지원: 병원비가 1년에 많이 나오면 건강보험공단이 돌려주는 돈이 있는데, 신청해 보신 적 있으세요?\n   → 안 찾아가면 3년 지나 사라져요.\n③ 갱신: 가지고 계신 보험 중에 갱신형이 있는지 아세요?\n   → 갱신 때마다 나이 따라 보험료가 다시 계산돼서, 한 번에 2배 넘게 오른 사례도 있어요.\n\n모른다는 답이 만날 이유가 돼요. 설명은 한 문장만.\n\n• 고객 나이·상황에 맞춰 바꿔 쓰기: 멘트 「질문 모음」 탭 (뇌혈관 범위 · 4세대 할증 · 숨은 보험금 · 보장 만기 · 간병비 · 납입면제 · 청구 3년)\n• 왜: \"모르겠는데요\"라고 자기 입으로 말한 순간 궁금증이 고객 쪽에서 생김. 귀로만 듣는 건 서너 개가 한계"}, {"n": "4", "title": "판정 → 함의 → 날짜", "sub": "부탁이 아니라 결과 · 함의는 구체적으로", "body": "말씀드린 것 중에 N개가 처음 들으신 거면 확인해 보셔야 하는 분이에요.\n이런 건 모르고 지나가면, [고객이 모른 것의 실제 결과·기한]. 그래서 확인은 제가 도와드릴게요.\n가입 내역을 조회해 봐야 답이 나와서, 만나서 받을 돈·놓친 돈·새는 돈으로 정리해 보여 드릴게요. 보통 30분 안팎이고, 상품 얘기는 제가 먼저 안 꺼내요.\n[목요일 오후 2시]랑 [금요일 오후 4시] 중에 언제가 편하세요?\n→ 안 되면: 그럼 [다음 주 화요일 저녁]이랑 [토요일 오전] 중에는요?\n\n• 함의 예: 상한제 → 3년 지나면 사라져요 · 산정특례 → 30일 안에 등록 안 하면 그 사이 병원비는 혜택 못 받아요 · 뇌혈관 → 뇌경색이면 못 받으실 수 있어요\n• \"상담 안 받으시면 크게 손해 보세요\"처럼 막연하게는 말하지 않기: 단정으로 들리고(금소법 제21조 소지) 경계를 켬\n• 다 알고 있으면: 잘 챙기고 계시네요. 주변에 이런 거 모르실 것 같은 가족분 계시면 말씀해 주세요. → 정중히 종료"}, {"n": "5", "title": "장소 · 복창", "sub": "월·일·요일·시각·장소를 한 번에", "body": "등록된 주소가 [OO동]이던데, 댁이랑 근처 카페 중에 어디가 편하세요?\n그럼 [11월 O일 O요일 오후 O시], [OO카페]에서 뵙겠습니다. 끊고 바로 카톡으로 명함이랑 위치, 보험 조회용 본인인증 링크 보내 드릴게요.\n\n• \"연락드릴게요\"로 끝난 통화 4건은 흐지부지됐어요.\n• 상세 주소는 묻지 않기."}, {"n": "6", "title": "방송 DB", "sub": "직접 신청한 고객 · 질문 없이 바로 날짜", "body": "OOO님 맞으시죠? CJ온스타일 통해 상담 맡게 된 {내회사} {내이름}입니다.\n방송 보시고 건강보험 상담 신청해 주셔서, 방문 일정 잡으려고 연락드렸어요.\n[화요일 오전 11시]랑 [목요일 오후 2시] 중에 언제가 편하세요?\n(물으면) 갖고 계신 보험은 그대로 두고, 보험료만큼 보장이 제대로 되는지랑 놓친 보험금은 없는지 같이 봐 드려요.\n\n• 설명이 길어지면 거절이 나와요.\n• 사은품은 회사 기준대로 안내만. 만남 조건으로 걸지 않기.\n• 부재중이면 후킹 장표 대신 자기소개만."}, {"n": "7", "title": "만나서 상담 시작할 때", "sub": "대면 도입 · 통화에선 반응 카드의 짧은 버전", "body": "독감은 걸려도 며칠 앓고 \"맞을걸\" 하고 넘어가잖아요. 보험은 그렇게 털어낼 일이 아닙니다. 큰돈이 나가고, 어떤 치료를 받을 수 있는지가 여기서 갈립니다.\n우리나라 사람이 평생 암에 걸릴 확률이 남자 44.6%, 여자 38.2%입니다. 아플지 말지는 정할 수 없지만, 그때 쓸 수 있는 돈과 방법은 미리 알 수 있습니다.\n그리고 독감주사처럼, 아프고 나서는 늦습니다. 진단을 받으면 보장을 늘리기 어렵거든요. 그래서 지금 한 번 확인해 두시는 겁니다.\n\n근거: 기대수명까지 살 때 암 걸릴 확률 남 44.6% · 여 38.2% (2023 국가암등록통계, 세계일보 2026.1.20). 65세 이상 고객에겐 첫 두 문장 대신 \"독감주사도 걸리기 전에 맞으시잖아요\"로 시작. \"오늘 제 제안이 도움이 되실 거다\" 같은 결과 약속은 하지 않기."}], "reacts": [{"trigger": "\"신청 안 했는데요 / 기억 안 나요\"", "say": "네~ 기억 안 나실 수 있어요, 맞아요. 빠르게 통화가 이뤄져서 그러실 거예요. 그래서 연락드린 건데요,", "note": "쉬지 말고 바로 본론 (11/9 조회)"}, {"trigger": "\"바빠요 / 운전 중이에요 / 회사예요\"", "say": "네, 그럼 [오늘 저녁 7시]에 1분만 다시 드릴게요.", "note": "설명 없이 바로 끊기. \"몇 시가 편하세요?\"로 물으면 \"모르겠다\"가 나옴"}, {"trigger": "부재중 보고 콜백 \"전화 주셨나요?\"", "say": "네, 급한 건 아니에요. CJ 통해 보장 점검 맡은 {내이름}인데 1분만 말씀드릴게요.", "note": "급한 일인 줄 알고 받은 상태"}, {"trigger": "\"보험 들라는 거죠? / 보험이에요?\"", "say": "네 맞아요, 보험 점검이에요. 그래서 연락드린 건데요, (→ 본론) 가입 권유 전에 지금 갖고 계신 보험부터 봐 드려요.", "note": "\"보험 때문은 아니고요\"로 부인하면 뒤에서 신뢰가 깨짐"}, {"trigger": "\"보험 팔려는 거잖아요\"", "say": "필요 없으면 안 하셔도 돼요. 다만 안 받은 보험금은 가입이랑 상관없이 원래 고객님 돈이에요.", "note": ""}, {"trigger": "\"담당 설계사 있어요\"", "say": "좋네요. 그분이 먼저 연락 자주 주세요? → \"필요할 때만요\"면: 그럼 바뀐 건 못 들으셨겠네요. 실비 세대랑 안 받은 보험금만 봐 드릴게요.", "note": "담당자 유무보다 관리 공백을 찾기. 가족이 담당자면 정중히 종료"}, {"trigger": "\"보험 충분해요 / 필요 없어요\" (가벼운 거절)", "say": "독감주사도 걸린 다음에 맞으면 소용없잖아요. 보험도 아프고 나면 고치기 어려워서, 미리 한 번 봐 드리는 거예요. [A]랑 [B] 중에 언제가 편하세요?", "note": "한 번만. 65세 이상은 \"독감주사는 나라에서 무료로 해 주니까 걸리기 전에 맞으시잖아요\"로 시작"}, {"trigger": "\"전화로 해 주세요 / 집에 오는 건 좀\"", "say": "그럼 방문 없이 할게요. 동의 링크 하나 보내 드릴 테니 인증만 해 주시면, 정리해서 [목요일 오후 3시]에 전화로 설명드릴게요.", "note": "결과 설명 때 \"화면을 같이 보면서 설명드려야 정확해서요\"로 대면 전환. \"방문이 원칙\"으로 밀면 끊김"}, {"trigger": "\"요즘 바빠요, 한두 달 뒤에\"", "say": "그럼 날짜만 정해 둘게요. [12월 첫째 주 토요일 오전]이랑 [평일 저녁] 중에요? 그 전에 바뀌는 건 카톡으로 드릴게요.", "note": "\"시간 되면 연락 줄게요\"로 끝나면 연락 안 옴"}, {"trigger": "\"출장이라 2주 없어요\"", "say": "네, 그럼 다녀오신 뒤로 잡으면 돼요. [11월 중순] 평일 저녁이랑 주말 중에요?", "note": "시간 문제지 필요 거절이 아님"}, {"trigger": "\"생각해 볼게요\"", "say": "네, 그럼 날짜만 잡아 두고 안 되시면 편하게 미뤄 주세요. [A]랑 [B] 중에요?", "note": ""}, {"trigger": "\"보험료 올라서 해약하려고요\"", "say": "해약하시기 전에 꼭 먼저 보셔야 해요. 한 번 해지하면 같은 조건으로 다시 못 들어요. [A]랑 [B] 중에 보시죠.", "note": "가장 급한 고객. 놓치지 말 것"}, {"trigger": "\"보험료 내는데 혜택이 뭐가 있어요?\"", "say": "그래서 확인해 드리는 거예요. 받을 수 있는데 안 받은 돈, 나라에서 신청해야 주는 돈부터 봐 드려요.", "note": "불만이 곧 니즈. 보험 일반론 설명 금지"}, {"trigger": "\"나이 많아도 괜찮아요?\"", "say": "네, 확인해 볼 수 있어요. [화요일 오전]이랑 [목요일 오후] 중에 언제가 편하세요?", "note": "관심 신호. 가입 나이는 상품별 확인 필요"}, {"trigger": "\"몇 분 걸려요?\"", "say": "보통 30분 안팎이에요. 보험이 많으시면 조금 더 걸려요.", "note": "줄여 말하지도 늘려 말하지도 않기"}, {"trigger": "\"선물만 보내 주세요\"", "say": "사은품은 회사 기준대로 안내해 드릴게요. 점검은 [A]랑 [B] 중에 언제가 편하세요?", "note": "사은품을 만남 조건으로 걸지 않기"}, {"trigger": "\"필요 없어요\"(두 번) / \"전화하지 마세요\"", "say": "네, 알겠습니다. 먼저 연락드리지 않을게요.", "note": "바로 종료. 마무리 문자는 한 번만, 권유 없이 (거부 후 계속 권유는 금소법상 부당권유)"}], "bans": [{"bad": "통화 잠깐 괜찮으세요?", "fix": "1분만 말씀드릴게요.", "full": "통화 잠깐 괜찮으세요? → 1분만 말씀드릴게요."}, {"bad": "CJ랑 통화하신 거 기억하세요? / 기억 안 나시죠?", "fix": "보장 점검 동의해 주셔서 연락드렸어요.", "full": "CJ랑 통화하신 거 기억하세요? / 기억 안 나시죠? → 보장 점검 동의해 주셔서 연락드렸어요."}, {"bad": "보험 때문은 아니고요 / 판매 목적 아니에요", "fix": "네, 보험 점검이에요. / 상품 얘기는 제가 먼저 안 꺼내요.", "full": "보험 때문은 아니고요 / 판매 목적 아니에요 → 네, 보험 점검이에요. / 상품 얘기는 제가 먼저 안 꺼내요."}, {"bad": "모든 분께 필요한 거예요", "fix": "모든 분께 필요한 건 아니라서, 해당되는지만 봐 드려요.", "full": "모든 분께 필요한 거예요 → 모든 분께 필요한 건 아니라서, 해당되는지만 봐 드려요."}, {"bad": "괜찮으실까요? / 언제가 편하세요? / 토요일 어떠세요?", "fix": "[A] function nowLocal(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function wilsonLB(k,n){ if(!n) return 0; const z=1.96,p=k/n; return Math.max(0,(p+z*z/(2*n)-z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)))/(1+z*z/n)); }
const pct=(k,n)=>n?Math.round(100*k/n):0;
function rateCell(k,n){ if(!n) return '<span class="sub">—</span>'; const base=`${k}/${n} · ${pct(k,n)}%`; return n<MIN_N?`${base} <span class="chip lock">데이터 부족</span>`:`${base} <span class="sub">(최소 ${Math.round(100*wilsonLB(k,n))}%)</span>`; }

function demoQlogs(){
 let seed=20261109; const rnd=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
 const out=[]; const users=['u_new1','u_new2','u_mgr']; const base=new Date(); base.setHours(0,0,0,0);
 for(let i=0;i<72;i++){
  const u=users[i%3]; const d=new Date(base); d.setDate(d.getDate()-Math.floor(rnd()*12)); d.setHours(10+Math.floor(rnd()*10),Math.floor(rnd()*60),Math.floor(rnd()*60));
  const p=n=>String(n).padStart(2,'0'); const at=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const db=rnd()<0.75?'퍼미션':'방송'; const seg=SEGS[Math.floor(rnd()*4)][0]; const connected=rnd()<0.55;
  const r={id:'qd'+String(i).padStart(3,'0'),userId:u,at,db,seg,connected,stage:0,qs:[],br:[],result:connected?'':'부재',reason:'',secs:connected?20+Math.floor(rnd()*200):0,next:'',met:'',demo:true,src:'demo'};
  if(connected){
   if(db==='퍼미션'){
    const s=rnd(); r.stage=s<0.18?1:s<0.35?2:s<0.6?3:s<0.8?4:5;
    if(r.stage>=3){ const ids=IQ_DEFAULT[seg]; r.qs=ids.slice(0,r.stage===3?1+Math.floor(rnd()*3):3).map(id=>({id,r:rnd()<(id==='cap'?0.75:id==='stroke'?0.7:0.55)?'몰랐음':'알았음'})); }
    if(r.stage===1) r.br.push(rnd()<0.5?'forget':'busy');
    if(r.stage>=2&&rnd()<0.4) r.br.push('forget');
    const unknown=r.qs.filter(q=>q.r==='몰랐음').length;
    r.result=r.stage===5?(rnd()<0.45+0.1*unknown?'약속':'콜백'):r.stage===4?(rnd()<0.5?'카톡·링크':'보류'):r.stage===1?(r.br.includes('busy')?'콜백':'거절'):(rnd()<0.5?'거절':'보류');
   } else { r.stage=rnd()<0.6?5:1; r.result=r.stage===5?(rnd()<0.6?'약속':'콜백'):(rnd()<0.5?'거절':'콜백'); if(rnd()<0.3) r.br.push('old'); }
   if(r.result!=='약속') r.reason=REASONS[Math.floor(rnd()*REASONS.length)];
   if(r.result==='약속') r.met=rnd()<0.3?'':(rnd()<0.75?'성사':'노쇼');
  }
  out.push(r);
 }
 return out;
}

function mergeQlogTexts(texts){
 let added=0,dup=0,bad=0,users=0,ex=0; const have=new Set(DB.qlogs.map(r=>r.id));
 for(const tx of texts){ try{ const d=JSON.parse(tx); if(d.kind!=='callAllInOne.qlogs'||!d.user) throw 0; if(DEMO_IDS.includes(d.user.id)){ ex++; continue; } let u=userById(d.user.id)||DB.users.find(x=>x.name===d.user.name); if(!u){ u={id:d.user.id||uid('u'),name:d.user.name||'이름 없음',role:'agent',team:d.user.team||'',pin:'',phone:''}; DB.users.push(u); users++; }
   if(d.feedback&&typeof d.feedback==='object'){ DB.teamFeedback=DB.teamFeedback||[]; for(const [wk,f] of Object.entries(d.feedback)){ const key=u.id+'|'+wk; const i=DB.teamFeedback.findIndex(x=>x.key===key); const row={key,userId:u.id,name:u.name,week:wk,pain:f.pain||'',win:f.win||'',change:f.change||''}; if(i>=0) DB.teamFeedback[i]=row; else DB.teamFeedback.push(row); } }
   if(d.user.title&&!u.title) u.title=d.user.title; if(d.mine&&typeof mineImport==='function') mineImport(u.id,d.mine); if(d.monthly&&typeof d.monthly==='object'){ DB.monthly=DB.monthly||{}; DB.monthly[u.id]=Object.assign({},DB.monthly[u.id]||{},d.monthly); }
   for(const r of d.qlogs||[]){ if(!r||!r.id) continue; if(have.has(r.id)){ dup++; continue; } DB.qlogs.push({...r,userId:u.id,src:'import',demo:false}); have.add(r.id); added++; } }catch(err){ bad++; } }
 save(); toast(`${added}건 추가 · 중복 ${dup}건 건너뜀${users?` · 새 팀원 ${users}명`:''}${ex?` · 예시 계정 ${ex}개 건너뜀`:''}${bad?` · 못 읽은 것 ${bad}개`:''}`); render();
}

/* ---------- 저장: 클로드 계정(db, 나만 보는 공간) + 이 기기 캐시 ---------- */
const CLOUD={on:false,db:null,col:'',rev:0,timer:null,busy:false,state:'local',dev:(()=>{ try{ let d=localStorage.getItem('cai.dev'); if(!d){ d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('cai.dev',d);} return d; }catch(e){ return 'd'+Date.now().toString(36); } })()};
const CHUNK=60000; // 한글 3바이트 기준으로도 문서 하나 256KiB 아래
function cloudBadge(){ const b=document.getElementById('syncBadge'); if(!b) return; if(srvOn()){ srvBadge(); return; } const t={cloud:'동기화',saving:'저장 중',init:'연결 중',local:'이 기기만'}[CLOUD.state]||''; b.textContent=t; b.dataset.s=CLOUD.state; b.title=CLOUD.state==='local'?'내 클로드에 올린 내 앱에서 열면 모든 기기에서 같은 기록을 봐요':'내 클로드 계정에 저장돼요'; }
async function cloudPull(){
 const snap=await CLOUD.db.collection(CLOUD.col).get(); const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); });
 const meta=m.meta; if(!meta||!meta.n) return null; let s=''; CLOUD.n0=Math.max(meta.n,Object.keys(m).filter(k=>/^cd+$/.test(k)).length);
 for(let i=0;i<meta.n;i++){ const c=m['c'+i]; if(!c||c.rev!==meta.rev) return {broken:true}; s+=c.s; }
 try{ return {rev:meta.rev,data:JSON.parse(s)}; }catch(e){ return {broken:true}; }
}
/* Claude 저장소(본인 칸)에 올리는 사본. 고객 이름(cust)·다음 연락 메모(next)·고객 이름표(customers)는 빼요. 이 기기에만 남아요. (2026-11-22) */
function cloudCopy(d){ const o=Object.assign({},d); o.qlogs=(d.qlogs||[]).map(r=>{ if(!r||(r.cust===undefined&&r.next===undefined)) return r; const x=Object.assign({},r); delete x.cust; delete x.next; return x; }); o.customers={}; return o; }
async function cloudPush(){
 const s=JSON.stringify(cloudCopy(DB)); const n=Math.max(1,Math.ceil(s.length/CHUNK)); const rev=Date.now();
 for(let i=0;i<n;i++) await CLOUD.db.doc(CLOUD.col+'/c'+i).set({rev,s:s.slice(i*CHUNK,(i+1)*CHUNK)});
 await CLOUD.db.doc(CLOUD.col+'/meta').set({rev,n,at:new Date().toISOString(),dev:CLOUD.dev,app:APP_VER,noNames:1});
 CLOUD.rev=rev;
 // 예전에 더 많이 올렸던 조각(이름이 든 옛 사본일 수 있음)은 지워요
 for(let i=n;i<(CLOUD.n0||n);i++){ try{ await CLOUD.db.doc(CLOUD.col+'/c'+i).delete(); }catch(e){} } CLOUD.n0=n;
}
function mergeDB(a,b){ // a: 클로드에 있던 것, b: 이 기기 것 → id 기준 합치기 (같은 id는 a)
 const out=Object.assign({},b,a);
 for(const k of ['qlogs','calls','sessions','proposals','users']){ const map=new Map(); (a[k]||[]).forEach(x=>x&&x.id&&map.set(x.id,x)); (b[k]||[]).forEach(x=>{ if(x&&x.id&&!map.has(x.id)) map.set(x.id,x); }); out[k]=[...map.values()]; }
 const cu={}; for(const src of [b.customers||{},a.customers||{}]) for(const [uidk,obj] of Object.entries(src)) cu[uidk]=Object.assign({},cu[uidk]||{},obj);
 out.customers=cu; out.feedback=Object.assign({},b.feedback||{},a.feedback||{}); out.teamFeedback=[...new Map([...(b.teamFeedback||[]),...(a.teamFeedback||[])].map(x=>[x.key,x])).values()];
 if(typeof mergeMine==='function') mergeMine(out,a,b);
 out.monthly={}; for(const src of [b.monthly||{},a.monthly||{}]) for(const [uk,obj] of Object.entries(src)) out.monthly[uk]=Object.assign({},out.monthly[uk]||{},obj);
 const bu=new Map((b.users||[]).map(u=>[u.id,u])); out.users.forEach(u=>{ const o=bu.get(u.id); if(o&&o.terms&&(!u.terms||o.terms>u.terms)){ u.terms=o.terms; u.termsAt=o.termsAt; } });
 // 저장소 사본에는 고객 이름·메모가 없어요. 같은 기록이면 이 기기에 있던 이름·메모를 그대로 둬요
 const bq=new Map((b.qlogs||[]).map(r=>[r&&r.id,r])); out.qlogs=out.qlogs.map(r=>{ const o=bq.get(r.id); if(!o||o===r||(o.cust===undefined&&o.next===undefined)) return r; const x=Object.assign({},r); if(x.cust===undefined&&o.cust!==undefined) x.cust=o.cust; if(!x.next&&o.next) x.next=o.next; return x; });
 out.meId=a.meId||b.meId; return out;
}
function relinkMe(){ const id=(ME&&ME.id)||lsMe()||DB.meId; const u=id?userById(id):null; ME=u&&!isEx(u)?u:null; if(ME){ DB.meId=ME.id; lsMe(ME.id); } }
function cloudSchedule(){ clearTimeout(CLOUD.timer); CLOUD.state='saving'; cloudBadge(); CLOUD.timer=setTimeout(cloudFlush,1200); }
async function cloudFlush(){
 if(!CLOUD.on) return; if(CLOUD.busy){ cloudSchedule(); return; } CLOUD.busy=true;
 try{
  const meta=await CLOUD.db.doc(CLOUD.col+'/meta').get();
  if(meta.exists&&meta.data().rev!==CLOUD.rev){ const r=await cloudPull(); if(r&&!r.broken){ const n0=(DB.qlogs||[]).length; DB=mergeDB(mergeSeed(r.data),DB); relinkMe(); if((DB.qlogs||[]).length!==n0&&!LIVE) render(); } }
  await cloudPush(); CLOUD.state='cloud';
  await callsPush();
 }catch(e){ if(e&&e.code==='invalid_argument'){ CLOUD.on=false; CLOUD.state='local'; } else { CLOUD.state='cloud'; if(e&&e.code==='quota_exceeded') toast('저장 공간이 꽉 찼어요. 오래된 연습 기록을 지워 주세요.'); } }
 CLOUD.busy=false; cloudBadge();

  CLOUD.db=db; CLOUD.col='data/users/'+id;

  CLOUD.on=true; CLOUD.uid=id; await cloudPush(); CLOUD.state='cloud'; callsPush();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){}

 relinkMe(); if(!LIVE) render(); cloudBadge();
 document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!CLOUD.on||CLOUD.busy||LIVE) return;
  try{ const m=await CLOUD.db.doc(CLOUD.col+'/meta').get(); if(m.exists&&m.data().rev!==CLOUD.rev){ const r=await cloudPull(); if(r&&!r.broken){ DB=mergeDB(mergeSeed(r.data),DB); CLOUD.rev=r.rev; relinkMe(); try{ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){} render(); } } }catch(e){}
 });

  {k:'hook',th:'cap',label:'상한제',ev:['e3'],text:'OOO 고객님, {내회사} {내이름}입니다.\n\n1년 병원비가 상한을 넘으면 건강보험에서 돌려주는데, 안 찾아간 돈만 3,617억 원이에요. 3년 지나면 사라져요.\n[O요일 O시]에 다시 연락드릴게요.\n\n{내이름} {내번호}'},
  {k:'hook',th:'claim',label:'청구 기한',ev:['e6','e7'],text:'OOO 고객님, {내회사} {내이름}입니다.\n\n실비는 병원 다녀온 지 3년이 지나면 청구를 못 해요. 한 해 청구 안 된 실비만 약 2,500억 원이에요.\n놓친 게 있는지 [O요일 O시]에 다시 연락드려 같이 볼게요.\n\n{내이름} {내번호}'}]},
 {id:'s_tvno',g:'안 받음',short:'부재 · 방송',name:'부재중 · 방송 DB (자기소개만)',when:'방송 DB는 후킹 없이 가벼운 자기소개만. 다시 걸기: 당일 다른 시간대 1번 → 다음 날 1번 → 마지막 문자 1번.',card:'none',msgs:[
  {k:'basic',label:'첫 부재',text:'OOO 고객님, CJ온스타일 방송 보시고 신청해 주신 건강보험 상담을 맡게 된 {내회사} {내이름}입니다.\n방금 연락드렸는데 통화가 어려우셔서 인사만 남겨요.\n\n[O요일 오후 O시]에 이 번호로 다시 연락드릴게요. 저장해 두시면 받으실 때 편하세요.\n\n{내이름} {내번호}'},
  {k:'short',label:'짧게',text:'OOO 고객님, CJ온스타일 방문상담 담당 {내회사} {내이름}입니다.\n인사만 남겨요. [O요일 오후 O시]에 다시 연락드릴게요.'},
  {k:'polite',label:'정중하게',text:'안녕하세요, OOO 고객님. CJ온스타일 방송 보고 신청해 주신 상담 담당 {내회사} {내이름}입니다.\n이 번호를 저장해 두시면 다음에 받으실 때 편하세요.\n[O요일 O시]에 다시 연락드리겠습니다.'},
  {k:'sched',label:'두 번째 부재',text:'OOO 고객님, {내회사} {내이름}입니다.\n오늘 두 번 연락드렸는데 바쁘신 것 같아 문자로 남겨요.\n내일 [오전 O시]에 한 번 더 연락드릴게요.'},
  {k:'last',label:'마지막 문자',text:'OOO 고객님, CJ온스타일 방문상담 담당 {내회사} {내이름}입니다.\n몇 번 연락드렸는데 닿지 않아 문자로 남겨요.\n상담이 필요하실 때 이 번호로 연락 주시면 바로 날짜 잡아 드릴게요.\n\n{내이름} {내번호}'}]},
 {id:'s_kakao',g:'통화 직후',short:'톡으로 남겨 달라',name:'"톡으로 남겨 주세요" · 시간 못 정함',when:'운전 중·회의 중, "나중에 해 주세요". 물음표로 끝내지 않고, 다음 연락 시각은 내가 정해요.',card:'hook',ex:'ex_hidden',msgs:[
  {k:'basic',label:'기본',text:'OOO 고객님, 방금 통화한 {내회사} {내이름}입니다.\n바쁘신 것 같아 톡으로 남겨요. 보장 점검 날짜만 정하면 되는 건이에요.\n[내일 저녁 O시]에 다시 연락드릴게요.'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다.\n말씀하신 대로 톡 남겨요. [O요일 O시]에 다시 연락드릴게요.'},
  {k:'hook',label:'후킹 한 줄',ev:['e9'],text:'OOO 고객님, {내회사} {내이름}입니다. 바쁘셔서 한 줄만 남겨요.\n4세대 실비는 1년 비급여 보험금이 100만 원을 넘으면 다음 해 보험료가 할증돼요. 고객님 실비가 몇 세대인지부터 볼게요.\n[O요일 O시]에 연락드릴게요.'},
  {k:'info',label:'장표 같이',text:'OOO 고객님, {내회사} {내이름}입니다.\n톡으로 남겨 달라고 하셔서 한 장으로 정리해 보내요. 하나라도 처음 보시는 게 있으면 확인해 보셔야 해요.\n[O요일 O시]에 다시 연락드릴게요.'},
  {k:'polite',label:'정중하게',text:'안녕하세요, OOO 고객님. 조금 전 통화한 {내회사} {내이름}입니다.\n바쁘신데 받아 주셔서 감사합니다.\n[O요일 O시]에 다시 연락드리겠습니다.'}]},
 {id:'s_callback',g:'통화 직후',short:'콜백 시각 확정',name:'콜백 시각 확정',when:'"퇴근 후에 전화 주세요"처럼 다시 통화할 시각이 정해진 고객. 끊자마자 보내요.',card:'ex',ex:'ex_process',msgs:[
  {k:'basic',label:'기본',text:'OOO 고객님, CJ온스타일 통해 상담 맡게 된 {내회사} {내이름}입니다.\n말씀하신 대로 [O일 O요일 저녁 O시]에 연락드릴게요.\n\n{내이름} {내번호}'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다. [O요일 저녁 O시]에 연락드릴게요.'},
  {k:'info',label:'진행 안내',text:'OOO 고객님, {내회사} {내이름}입니다.\n보장 점검이 어떻게 진행되는지 한 장으로 보내 드려요.\n[O요일 O시]에 연락드려서 만날 날짜만 정할게요.'},
  {k:'hook',label:'한 줄 예고',text:'OOO 고객님, {내회사} {내이름}입니다.\n[O요일 O시]에 연락드릴게요. 그때 고객님 실비가 몇 세대인지, 산정특례·상한제 같은 나라 지원을 챙기고 계신지부터 볼게요.'},
  {k:'polite',label:'정중하게',text:'안녕하세요, OOO 고객님. 오늘 통화한 {내회사} {내이름}입니다.\n말씀하신 [O요일 O시]에 다시 연락드리겠습니다. 시간이 바뀌면 이 번호로 편하게 알려 주세요.'}]},
 {id:'s_link',g:'통화 직후',short:'방문 거절 · 링크',name:'방문 거절 · 동의 링크로 전환',when:'"방문은 안 해요" → 카톡으로 조회 동의 링크를 보내고 본인인증을 받기로 한 고객.',card:'ex',ex:'ex_link',msgs:[
  {k:'basic',label:'기본',text:'OOO 고객님, {내회사} {내이름}입니다.\n말씀하신 대로 방문 없이 진행할게요. 잠시 후 보험 조회용 본인인증 링크가 가요.\n인증해 주시면 [O요일]까지 정리해서 연락드릴게요.'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다. 방금 말씀드린 인증 링크 보내요. 인증만 해 주시면 돼요.'},
  {k:'info',label:'안심 한 줄',text:'OOO 고객님, {내회사} {내이름}입니다.\n인증은 가입하신 보험을 조회하는 용도예요. 인증만으로 가입이나 결제가 되지는 않아요.\n[O요일]까지 정리해서 연락드릴게요.'},
  {k:'hook',label:'결과 예고',text:'OOO 고객님, {내회사} {내이름}입니다.\n인증해 주시면 실비 세대, 갱신형인 보장, 비어 있는 보장 순서로 한 장에 정리해 보내 드릴게요.\n[O요일]까지 연락드릴게요.'},
  {k:'sched',label:'링크 다시',text:'OOO 고객님, {내회사} {내이름}입니다.\n링크가 안 열리면 이 번호로 "링크"라고만 보내 주세요. 다시 보내 드릴게요.\n[O요일 O시]에 인증이 됐는지 한 번 확인 연락드릴게요.'}]},
 {id:'s_nosilbi',g:'통화 직후',short:'실비 없음',name:'실비 없음 · 해지함',when:'"실비 해지했어요 / 없어요". 나라 지원과 실비 없을 때 비는 곳을 짚어요.',card:'ex',ex:'ex_nosilbi',msgs:[
  {k:'basic',label:'기본',ev:['e1','e2'],text:'OOO 고객님, {내회사} {내이름}입니다.\n실비가 없으시면 나라 지원부터 챙기셔야 해요. 암은 산정특례로 본인부담 5%, 1년 병원비가 상한을 넘으면 돌려받아요.\n고객님 기준으로 [O요일 O시]에 다시 연락드려 알려 드릴게요.'},
  {k:'hook',label:'보장률',ev:['e14'],text:'OOO 고객님, {내회사} {내이름}입니다.\n건강보험이 내주는 건 병원비의 64.9%예요. 나머지는 실비가 없으면 그대로 내 돈이에요.\n[O요일 O시]에 다시 연락드릴게요.'},
  {k:'info',label:'간병비',ev:['e15'],text:'OOO 고객님, {내회사} {내이름}입니다.\n입원하면 간병비가 따로 들어요. 간병인 쓰는 집은 한 달 평균 370만 원이고, 이건 실비로도 안 나와요.\n[O요일 O시]에 다시 연락드릴게요.'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다. 실비 없이 병원비 막는 방법을 정리해서 [O요일 O시]에 연락드릴게요.'},
  {k:'polite',label:'정중하게',text:'안녕하세요, OOO 고객님. 오늘 통화한 {내회사} {내이름}입니다.\n실비가 없으실 때 챙기실 나라 지원을 한 장으로 정리해 보내 드려요.\n[O요일 O시]에 다시 연락드리겠습니다.'}]},
 {id:'s_meet',g:'약속 뒤',short:'약속 확정',name:'대면 약속 확정',when:'날짜·장소가 정해진 고객. 끊자마자 확정 카톡 + 인증 링크. 월·일·요일·시각·장소를 다시 적어요.',card:'ex',ex:'ex_meet',msgs:[
  {k:'basic',label:'기본',text:'OOO 고객님, 방금 통화한 {내회사} {내이름}입니다.\n\n일정: [11월 O일 (O) 오후 O시]\n장소: [OO카페] [지도 링크]\n\n잠시 후 보험 조회용 본인인증 링크가 갈 거예요. 인증만 해 주시면 미리 분석해서 갈게요.\n일정이 바뀌면 이 번호로 편하게 연락 주세요.'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다.\n[11월 O일 (O) 오후 O시] [OO카페]에서 뵐게요.\n일정이 바뀌면 이 번호로 연락 주세요.'},
  {k:'info',label:'인증 링크',text:'OOO 고객님, {내회사} {내이름}입니다.\n잠시 후 보험 조회용 본인인증 링크가 가요. 인증해 주시면 가입하신 보험을 미리 정리해서 갈게요.\n[11월 O일 (O) 오후 O시] [OO카페]에서 뵙겠습니다.'},
  {k:'sched',label:'준비물',text:'OOO 고객님, {내회사} {내이름}입니다.\n일정: [11월 O일 (O) 오후 O시]\n장소: [OO카페]\n준비하실 건 없어요. 보험증권이 집에 있으면 사진만 찍어 두셔도 좋아요.'},
  {k:'polite',label:'정중하게 · 방송 DB',text:'안녕하세요, OOO 고객님. CJ온스타일 방문상담 담당 {내회사} {내이름}입니다.\n[11월 O일 (O) 오후 O시] [OO카페]에서 뵙겠습니다.\n방송에서 보신 사은품은 회사 기준대로 안내해 드릴게요.'}]},
 {id:'s_remind',g:'약속 뒤',short:'리마인드',name:'약속 리마인드',when:'오전 일정은 전날 저녁, 오후 일정은 당일 오전. 장표 없이 카톡만.',card:'none',msgs:[

  {k:'info',label:'인증 다시',text:'OOO 고객님, {내회사} {내이름}입니다.\n아직 본인인증이 안 돼 있어 링크를 한 번 더 보내요. 인증해 주시면 미리 정리해서 갈게요.\n[내일 오후 O시]에 뵙겠습니다.'},

 {id:'s_open',g:'마무리',short:'문 열어두기',name:'반응 안 좋음 · 문은 열어두기',when:'"안 해도 돼요" 두 번, "필요하면 연락할게요". 거부는 아니에요. 정보 장표로 마무리해도 돼요.',card:'ex',ex:'ex_keep',msgs:[
  {k:'basic',label:'기본',text:'OOO 고객님, 방금 통화한 {내회사} {내이름}입니다.\n필요하실 때 꺼내 보시라고 한 장 남겨요. 병원비를 돌려받는 제도들이라 알아 두시면 좋아요.\n이 번호 저장해 두시고 필요하실 때 연락 주세요.'},
  {k:'short',label:'짧게',text:'OOO 고객님, {내회사} {내이름}입니다. 시간 내 주셔서 감사합니다. 필요하실 때 이 번호로 연락 주세요.'},

 <div class="tabs2" role="tablist">${KT_SUBS.map(([id,n])=>`<button data-kt="${id}" aria-pressed="${KTAB===id}">${n}</button>`).join('')}</div><div id="ktBody"></div>`;
 $$('[data-kt]',v).forEach(b=>b.addEventListener('click',()=>{ KTAB=b.dataset.kt; kakaoView(v); }));
 ({make:kmView,sits:ktSitsView,hooks:ktHooksView,ex:ktExView,rules:ktRulesView,ev:ktEvView}[KTAB]||kmView)($('#ktBody',v));
}
function kmView(b){
 const recs=kmRecs(); const iq=(DB.playbook.iq||IQ); const sit=sitById(KM.sit);
 const srcKey=KM.src&&KM.src.id?(KM.src.type+':'+KM.src.id):'';

  <div class="field"><label class="f" for="kmSrc">통화한 고객 불러오기</label><select class="t" id="kmSrc"><option value="">직접 입력</option>${recs.map(r=>`<option value="${esc(r.key)}" ${r.key===srcKey?'selected':''}>${esc(r.label)}</option>`).join('')}</select>${recs.length?'':'<p class="sub" style="margin:6px 0 0">통화하기·통화 피드백에서 기록하면 여기서 고를 수 있어요.</p>'}</div>
  <div class="grid g2"><div class="field"><label class="f" for="kmName">고객 이름 <span class="sub">(카톡에만 들어가요)</span></label><input class="t" id="kmName" value="${esc(KM.name)}" placeholder="예: 김OO" autocomplete="off"></div>
  <div class="field"><label class="f" for="kmDb">DB</label><select class="t" id="kmDb">${['퍼미션','방송','기존고객'].map(x=>`<option ${KM.db===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="grid g2"><div class="field"><label class="f" for="kmSeg">나이대</label><select class="t" id="kmSeg">${KM_SEGS.map(([id,n])=>`<option value="${id}" ${KM.seg===id?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="field"><label class="f" for="kmSex">성별 <span class="sub">(암 통계를 고를 때만 써요)</span></label><select class="t" id="kmSex">${[['','모름'],['여','여성'],['남','남성']].map(([id,n])=>`<option value="${id}" ${KM.sex===id?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <p class="k" style="margin:0 0 6px">고객이 몰랐다고 한 것</p><div class="row kmun">${iq.map(q=>`<button type="button" class="pill" data-kun="${q.id}" aria-pressed="${KM.unknown.includes(q.id)}">${esc(q.title)}</button>`).join('')}</div>
  <div class="field" style="margin-top:12px"><label class="f" for="kmMemo">고객이 한 말 · 상황 <span class="sub">(번호·주소는 적지 않기)</span></label><textarea class="t" id="kmMemo" rows="3" placeholder="예: 운전 중이라 톡으로 남겨 달라고 함. 실비만 있다고 함.">${esc(KM.memo)}</textarea></div>
  ${KM.tr?`<p class="sub" style="margin:0">통화 녹취가 붙어 있어요 (이름·번호 가림). <button type="button" class="btn sm" id="kmTrX">빼기</button></p>`:''}
 </div>
 <div class="card"><h2><span class="no">2</span>어떤 상황</h2>
  <div class="field"><label class="f" for="kmSit">상황</label><select class="t" id="kmSit"><option value="">고르기</option>${KT_GROUPS.map(g=>`<optgroup label="${g}">${KT_SITS.filter(s=>s.g===g).map(s=>`<option value="${s.id}" ${KM.sit===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select><p class="sub" id="kmSitWhen" style="margin:6px 0 0">${sit?esc(sit.when):''}</p></div>
  ${KM.result==='연락 거부'?'<div class="warn">연락 거부 고객이에요. 보내지 않는 게 원칙이에요.</div>':''}
  <div class="field"><label class="f" for="kmNext">다음 연락 · 약속 <span class="sub">(있으면 카톡에 그대로 들어가요)</span></label><input class="t" id="kmNext" value="${esc(KM.next)}" placeholder="예: 11/12(목) 19시 재콜 · 11/14(토) 14시 OO카페"></div>
 </div>
 <div class="card"><h2><span class="no">3</span>어떻게 보낼까</h2>
  <p class="k" style="margin:0 0 6px">카톡 방식</p><div class="row">${KM_STYLES.map(([id,n])=>`<button type="button" class="pill" data-kst="${id}" aria-pressed="${KM.style===id}">${n}</button>`).join('')}</div>
  <div class="grid g2" style="margin-top:12px"><div class="field"><label class="f" for="kmCard">장표</label><select class="t" id="kmCard"><option value="auto" ${KM.card==='auto'?'selected':''}>상황에 맞게 자동</option><option value="none" ${KM.card==='none'?'selected':''}>장표 없이 카톡만</option><optgroup label="예시에서 고르기">${CARD_EX.map(e=>`<option value="${e.id}" ${KM.card===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</optgroup></select></div>
  <div class="field"><label class="f" for="kmTheme">장표 색</label><select class="t" id="kmTheme"><option value="navy" ${KM.theme==='navy'?'selected':''}>네이비 (기본 장표)</option><option value="blue" ${KM.theme==='blue'?'selected':''}>블루</option></select></div></div>
  <label class="chk"><input type="checkbox" id="kmPhone" ${KM.phone!==false?'checked':''}> 장표에 내 번호 넣기${ME.phone?'':' <span class="sub">(설정에서 번호를 넣으면 들어가요)</span>'}</label>
  <div class="row" style="margin-top:16px"><button class="btn pri" id="kmGo">카톡·장표 만들기</button><span class="sub">${(SAMPLE||aiOn())?'AI가 이 고객에 맞춰 새로 써요':'AI 없이 문구 모음에서 골라요'}</span></div>
  <details class="kmother"><summary>다른 AI(ChatGPT·제미나이)로 만들기</summary>
   <ol class="sub" style="margin:8px 0;padding-left:18px"><li>"질문 복사"를 눌러 ChatGPT에 붙여 넣어요.</li><li>나온 답을 통째로 복사해 아래 칸에 붙여 넣어요.</li><li>"장표로 만들기"를 누르면 카톡과 장표 이미지가 나와요.</li></ol>
   <div class="row"><button type="button" class="btn sm" id="kmCopyQ">질문 복사</button></div>
   <textarea class="t" id="kmPaste" rows="3" placeholder="다른 AI 답을 여기에 붙여 넣기" style="margin-top:8px"></textarea>
   <div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="kmPasteGo">장표로 만들기</button></div></details>
 </div></div>
 <div class="kmout" id="kmOut">${KM.out?kmOutHTML():'<div class="card kmempty"><h2>여기에 나와요</h2><p class="sub">왼쪽 1~3을 채우고 "카톡·장표 만들기"를 누르면 보낼 카톡과 장표 이미지가 여기에 나와요.</p><ol class="sub" style="margin:8px 0 0;padding-left:18px"><li>고객을 불러오면 DB·나이대·몰랐던 것·다음 연락이 자동으로 채워져요.</li><li>상황은 통화 결과에 맞춰 골라져요. 바꿔도 돼요.</li><li>장표는 "문구 고치기"로 고친 뒤 이미지로 저장해 카톡에 붙여요.</li></ol></div>'}</div></div>`;
 const read=()=>{ KM.name=$('#kmName',b).value.trim(); KM.db=$('#kmDb',b).value; KM.seg=$('#kmSeg',b).value; KM.sex=$('#kmSex',b).value; KM.memo=$('#kmMemo',b).value; KM.sit=$('#kmSit',b).value; KM.next=$('#kmNext',b).value.trim(); KM.card=$('#kmCard',b).value; KM.theme=$('#kmTheme',b).value; KM.phone=$('#kmPhone',b).checked; };
 ['#kmName','#kmMemo','#kmNext'].forEach(s=>$(s,b).addEventListener('input',read));
 ['#kmDb','#kmSeg','#kmSex','#kmCard','#kmPhone'].forEach(s=>$(s,b).addEventListener('change',read));
 $('#kmTheme',b).addEventListener('change',()=>{ read(); if(KM.out&&KM.out.card) kmDrawCard(); });
 $('#kmSit',b).addEventListener('change',()=>{ read(); const s=sitById(KM.sit); $('#kmSitWhen',b).textContent=s?s.when:''; });
 $('#kmSrc',b).addEventListener('change',e=>{ if(e.target.value) kmLoad(e.target.value); else kmKeep(); kmView(b); });
 $$('[data-kun]',b).forEach(x=>x.addEventListener('click',()=>{ const id=x.dataset.kun; KM.unknown=KM.unknown.includes(id)?KM.unknown.filter(z=>z!==id):KM.unknown.concat(id); x.setAttribute('aria-pressed',String(KM.unknown.includes(id))); }));
 $$('[data-kst]',b).forEach(x=>x.addEventListener('click',()=>{ KM.style=x.dataset.kst; $$('[data-kst]',b).forEach(z=>z.setAttribute('aria-pressed',String(z===x))); }));
 const tx=$('#kmTrX',b); if(tx) tx.addEventListener('click',()=>{ read(); KM.tr=''; kmView(b); });
 $('#kmGo',b).addEventListener('click',e=>{ read(); kmGenerate(e.currentTarget); });
 $('#kmCopyQ',b).addEventListener('click',()=>{ read(); if(!KM.sit){ toast('2번에서 상황을 골라 주세요'); return; } const p=kmPrompt(); copy(p.sys+'\n\n'+p.user+'\n\n위 형식의 JSON 하나만 답해 줘.'); });
 $('#kmPasteGo',b).addEventListener('click',()=>{ read(); if(!KM.sit){ toast('2번에서 상황을 골라 주세요'); return; } const j=parseJSON($('#kmPaste',b).value); if(!j||!j.kakao){ toast('답에서 JSON을 못 찾았어요. 답 전체를 붙여 넣어 주세요'); return; } kmApply(j,'other'); kmShowOut(); });
 if(KM.out) kmBindOut();
}
async function kmGenerate(btn){
 if(!KM.sit){ toast('2번에서 상황을 골라 주세요'); return; }
 if(!(SAMPLE||aiOn())){ kmApply(kmBankJ('AI 없이 문구 모음에서 골랐어요'),'bank'); kmShowOut(); return; }
 btn.disabled=true; const old=btn.textContent; btn.textContent='만드는 중…';
 try{ const p=kmPrompt(); const txt=await callClaude(p.sys,[{role:'user',content:p.user}],1400); const j=parseJSON(txt); if(!j||!j.kakao) throw new Error('답을 읽지 못했어요'); kmApply(j,'ai'); }
 catch(e){ toast(((e&&e.message)||'AI가 답하지 않았어요')+' · 문구 모음에서 골랐어요'); kmApply(kmBankJ('AI가 답하지 않아 문구 모음에서 골랐어요'),'bank'); }
 btn.disabled=false; btn.textContent=old; kmShowOut();
}
function kmShowOut(){ const o=$('#kmOut'); if(!o) return; o.innerHTML=kmOutHTML(); kmBindOut(); if(window.innerWidth<900) o.scrollIntoView({behavior:'smooth',block:'start'}); }
function kmOutHTML(){
 const o=KM.out, sit=sitById(KM.sit); const text=ktFill(o.kakao,KM.name);
 const warn=kmNumWarn([o.kakao,cardText(o.card)]);
 const byLine={ai:'AI가 이 고객에 맞춰 썼어요',other:'다른 AI 답으로 만들었어요',bank:''}[o.by]||'';
 return `<div class="card"><h2>보낼 카톡</h2>${o.why||byLine?`<p class="sub" style="margin:-4px 0 10px">${esc([byLine,o.why].filter(Boolean).join(' · '))}</p>`:''}
 <textarea class="t sms" id="kmText" rows="${Math.min(14,Math.max(6,text.split('\n').length+1))}">${esc(text)}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn pri sm" id="kmCopy">카톡 복사</button>${KM.src&&KM.src.type==='q'?'<button class="btn sm" id="kmLog">고객 기록에 "보냄" 남기기</button>':''}</div>
 ${/\[[^\]]*O[^\]]*\]|\[OO|\[지도|\[링크/.test(text)?'<p class="sub" style="margin:8px 0 0">[ ] 칸은 보내기 전에 채우세요.</p>':''}
 ${warn.length?`<div class="warn"><b>근거 숫자에 없는 숫자</b> · ${warn.map(esc).join(', ')}<br>출처를 확인하고 보내세요. 확인이 안 되면 숫자를 빼요.</div>`:''}
 ${o.next?`<p class="sub" style="margin:8px 0 0"><b>다음 연락</b> · ${esc(o.next)}</p>`:''}</div>
 ${o.card?`<div class="card"><h2>같이 보낼 장표</h2><div class="cprev"><canvas id="kmCv" role="img" aria-label="장표 미리보기"></canvas></div>
 <div class="row" style="margin-top:12px"><button class="btn pri sm" id="kmSave">이미지 저장</button><button class="btn sm" id="kmEditT" aria-expanded="false">문구 고치기</button>
 <select class="t" id="kmSwap" aria-label="다른 장표로 바꾸기" style="width:auto;min-height:32px;padding:4px 8px;font-size:13px"><option value="">다른 장표로 바꾸기</option>${CARD_EX.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
 <div id="kmEdit" hidden>${kmEditHTML(o.card)}</div>
 <p class="sub" style="margin:10px 0 0">장표엔 고객 이름이 들어가지 않아요. 오른쪽 아래엔 내 이름·회사${KM.phone!==false&&ME.phone?'·번호':''}만 들어가요.</p></div>`
 :`<div class="card"><h2>장표</h2><p class="sub" style="margin:0">${esc(sit&&sit.card==='none'&&KM.card==='auto'?'이 상황은 장표 없이 카톡만 보내요 (원칙). 꼭 보내려면 3번 "장표"에서 예시를 고르세요.':'장표 없이 카톡만 보내요.')}</p></div>`}`;
}
function kmEditHTML(c){ const H=c.hero||{}, Fo=c.foot||{};
 return `<div class="kmedit"><div class="grid g2"><div class="field"><label class="f" for="ceK">윗줄</label><input class="t" id="ceK" value="${esc(c.kicker||'')}"></div><div class="field"><label class="f" for="ceS">설명 한 줄</label><input class="t" id="ceS" value="${esc(c.sub||'')}"></div></div>
 <div class="field"><label class="f" for="ceT">제목 <span class="sub">(줄바꿈 그대로 · [[ ]] 안은 빨간 글씨)</span></label><textarea class="t" id="ceT" rows="2">${esc(c.title||'')}</textarea></div>
 <div class="grid g2"><div class="field"><label class="f" for="ceHl">큰 숫자 위 설명</label><input class="t" id="ceHl" value="${esc(H.label||'')}"></div><div class="field"><label class="f" for="ceHv">큰 숫자 · 단위 <span class="sub">(비우면 숫자 칸 없음)</span></label><div class="row" style="flex-wrap:nowrap"><input class="t" id="ceHv" value="${esc(H.value||'')}"><input class="t" id="ceHu" value="${esc(H.unit||'')}" style="max-width:80px"></div></div></div>
 <div class="field"><label class="f" for="ceHd">큰 숫자 아래 설명</label><input class="t" id="ceHd" value="${esc(H.desc||'')}"></div>
 ${c.rows?`<div class="field"><label class="f" for="ceR">일정·장소 칸 <span class="sub">(한 줄에 하나 · "일정 | 내용")</span></label><textarea class="t" id="ceR" rows="2">${esc(c.rows.map(r=>r[0]+' | '+r[1]).join('\n'))}</textarea></div>`:''}
 <div class="field"><label class="f" for="ceI">항목 <span class="sub">(한 줄에 하나 · "제목 | 설명")</span></label><textarea class="t" id="ceI" rows="4">${esc((c.items||[]).map(i=>i.t+(i.s?' | '+i.s:'')).join('\n'))}</textarea></div>
 <div class="grid g2"><div class="field"><label class="f" for="ceIs">항목 모양</label><select class="t" id="ceIs"><option value="q" ${c.itemStyle==='q'?'selected':''}>체크 + 물음표 (후킹)</option><option value="num" ${c.itemStyle!=='q'?'selected':''}>번호 (정보)</option></select></div><div class="field"><label class="f" for="ceBig">글씨</label><select class="t" id="ceBig"><option value="" ${c.big?'':'selected'}>보통</option><option value="1" ${c.big?'selected':''}>크게 (고령 고객)</option></select></div></div>
 <div class="grid g2"><div class="field"><label class="f" for="ceFt">아래 상자 굵은 글씨</label><textarea class="t" id="ceFt" rows="2">${esc(Fo.t||'')}</textarea></div><div class="field"><label class="f" for="ceFs">아래 상자 작은 글씨</label><input class="t" id="ceFs" value="${esc(Fo.s||'')}"></div></div>
 <div class="row"><button class="btn pri sm" id="ceGo">다시 그리기</button></div></div>`; }
function kmEditRead(){ const c=KM.out.card; const g=id=>($('#'+id)||{}).value||'';
 c.kicker=g('ceK').trim(); c.sub=g('ceS').trim(); c.title=g('ceT').replace(/\r/g,'').trim();
 const hv=g('ceHv').trim(); if(hv) c.hero={...(c.hero||{}),label:g('ceHl').trim(),value:hv,unit:g('ceHu').trim(),desc:g('ceHd').trim()}; else delete c.hero;
 c.items=g('ceI').split('\n').map(l=>l.trim()).filter(Boolean).slice(0,5).map(l=>{ const [t,...s]=l.split('|'); return {t:t.trim(),s:s.join('|').trim()}; });
 if($('#ceR')) c.rows=g('ceR').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [a,...b]=l.split('|'); return [a.trim(),b.join('|').trim()]; });
 c.itemStyle=g('ceIs')==='q'?'q':'num'; c.big=!!g('ceBig');
 const ft=g('ceFt').replace(/\r/g,'').trim(); c.foot=ft?{t:ft,s:g('ceFs').trim()}:null; KM.out.card=cardScrub(c); }
function kmDrawCard(){ const cv=$('#kmCv'); if(cv&&KM.out&&KM.out.card) cardRender(cv,KM.out.card,cardOpt(),0.6); }
function kmBindOut(){
 const cp=$('#kmCopy'); if(cp) cp.addEventListener('click',()=>copy($('#kmText').value));
 const lg=$('#kmLog'); if(lg) lg.addEventListener('click',()=>{ const r=(DB.qlogs||[]).find(x=>x.id===KM.src.id); if(!r) return; r.sent={at:nowLocal(),sit:KM.sit,style:KM.style,card:KM.out.card?(KM.out.card.name||'맞춤'):'',by:KM.out.by||''}; save(); toast('고객 기록에 남겼어요'); });
 if(!KM.out.card) return;
 kmDrawCard();
 $('#kmSave').addEventListener('click',()=>cardSave(KM.out.card,cardOpt()));
 $('#kmEditT').addEventListener('click',e=>{ const ed=$('#kmEdit'); ed.hidden=!ed.hidden; e.currentTarget.setAttribute('aria-expanded',String(!ed.hidden)); });
 $('#ceGo').addEventListener('click',()=>{ kmEditRead(); kmDrawCard(); const w=kmNumWarn([KM.out.kakao,cardText(KM.out.card)]); toast(w.length?'다시 그렸어요 · 근거에 없는 숫자: '+w.join(', '):'다시 그렸어요'); });
 $('#kmSwap').addEventListener('change',e=>{ const id=e.target.value; if(!id) return; KM.out.card=cardScrub(exClone(id)); const box=$('#kmOut'); box.innerHTML=kmOutHTML(); kmBindOut(); });
}

function ktSitsView(b){
 const sit=sitById(KT_SIT)||KT_SITS[0]; const ex=sit.card==='ex'?exById(sit.ex):null;
 b.innerHTML=`<div class="ktpick">${KT_GROUPS.map(g=>`<div class="kg"><span class="kgl">${g}</span><div class="row">${KT_SITS.filter(s=>s.g===g).map(s=>`<button type="button" class="pill" data-ks="${s.id}" aria-pressed="${s.id===sit.id}">${esc(s.short)}</button>`).join('')}</div></div>`).join('')}</div>

  /* 전에 허락받은 사람이면, 인터넷이 잠깐 끊겨도 통화는 계속할 수 있게 들여보내요. 기록은 연결되면 올라가요. */
  const ok=srvLsGet(SRV_OKKEY); if(ok){ SRV.uid=SRV.uid||ok; SRV.state='offline'; } else SRV.state='err';
 }
 render(); if(SRV.state==='ok') srvQueue();
}

/* 통화 기록 한 줄 → 서버 한 줄. 고객 이름(cust)과 다음 연락 메모(next)는 넣지 않아요. */
function srvRow(r){
 const data={}; ['qs','br','cl','sent','done','src','review'].forEach(k=>{ if(r[k]!==undefined) data[k]=r[k]; });
 const d=new Date(r.at); const pk=typeof packOf==='function'?packOf(r.db):null;
 return {id:r.id,user_id:SRV.uid,at:isNaN(d)?new Date().toISOString():d.toISOString(),db:r.db||'',lead:r.lead||(pk?pk.id:null),fv:r.fv||null,bv:r.bv||null,sv:r.sv==null?null:r.sv,
  seg:r.seg||'',connected:!!r.connected,stage:r.stage||0,result:r.result||'',reason:r.reason||'',secs:r.secs||0,try_n:r.tryN||null,met:r.met||'',app:r.app||null,data};
}
function srvHash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h); }
function srvSent(){ try{ return JSON.parse(srvLsGet(SRV_SENT)||'{}')||{}; }catch(e){ return {}; } }
function srvQueue(){ if(!srvOn()||(SRV.state!=='ok'&&SRV.state!=='offline')) return; clearTimeout(SRV.timer); SRV.timer=setTimeout(srvPush,1500); }
async function srvPush(){
 if(SRV.busy||!ME||!SRV.uid||(typeof isEx==='function'&&isEx(ME))) return;
 const sent=srvSent(); const todo=[];
 (DB.qlogs||[]).forEach(r=>{ if(r.userId!==ME.id||r.demo||r.src==='import') return; const row=srvRow(r); const h=srvHash(JSON.stringify(row)); if(sent[SRV.uid+':'+r.id]!==h) todo.push([row,h]); });
 if(!todo.length) return;
 SRV.busy=true; srvBadge();
 try{
  if(!(await srvFresh())) throw new Error(SRV.ses?'연결이 안 돼요':'login');
  for(let i=0;i<todo.length;i+=200){
   const part=todo.slice(i,i+200); const now=new Date().toISOString();
   const r=await srvFetch('/rest/v1/records?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:part.map(x=>Object.assign({updated_at:now},x[0]))});
   if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
   part.forEach(x=>{ sent[SRV.uid+':'+x[0].id]=x[1]; }); srvLsSet(SRV_SENT,JSON.stringify(sent));
  }
  SRV.state='ok'; SRV.err=''; SRV.last=Date.now();
 }catch(e){ SRV.err=String((e&&e.message)||e); if(SRV.err==='login'){ SRV.busy=false; render(); return; } SRV.state='offline'; }
 SRV.busy=false; srvBadge();
}
window.addEventListener('online',()=>{ if(srvOn()&&(SRV.state==='offline'||SRV.state==='err')) srvInit(); });

/* 앱에 적은 이름·소속을 서버 사람 표에 남겨요 (주인이 허락 화면에서 알아보게). 역할·허락은 이 길로 못 바꿔요. */
async function srvProfileSync(){

 const name=String(ME.name||'').slice(0,40), team=[ME.company,ME.team].filter(Boolean).join(' ').slice(0,60);
 if(SRV.prof.name===name&&(SRV.prof.team||'')===team) return; if(SRV.profTried===name+'|'+team) return;
 SRV.profBusy=true; SRV.profTried=name+'|'+team;

/* ---------- 서버에서 내려받기: 다른 기기에서 올린 내 통화 기록을 이 기기로 가져와요 ----------
   서버에는 고객 이름(cust)과 다음 연락 메모(next)가 없어요. 그래서 다른 기기에서 받은 기록은 그 두 칸이 비어 있어요.
   이미 이 기기에 있는 기록은 건드리지 않아요(이 기기 것이 원본). 없는 것만 더해요. */
function srvFromRow(x){
 const d=new Date(x.at); const p=n=>String(n).padStart(2,'0');
 const at=isNaN(d)?String(x.at||''):`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
 const r=Object.assign({},x.data||{},{id:x.id,userId:ME.id,at,db:x.db||'',seg:x.seg||'',connected:!!x.connected,stage:x.stage||0,result:x.result||'',reason:x.reason||'',secs:x.secs||0,next:'',met:x.met||''});
 r.qs=Array.isArray(r.qs)?r.qs:[]; r.br=Array.isArray(r.br)?r.br:[]; r.src=r.src||'live';
 if(x.app) r.app=x.app; if(x.sv!=null) r.sv=x.sv; if(x.lead) r.lead=x.lead; if(x.fv) r.fv=x.fv; if(x.bv) r.bv=x.bv; if(x.try_n) r.tryN=x.try_n;
 delete r.cust; return r;
}
async function srvPull(){
 if(!srvOn()||SRV.state!=='ok'||!ME||!SRV.uid||SRV.pulling||(typeof isEx==='function'&&isEx(ME))) return 0;
 SRV.pulling=true; let added=0;
 try{
  if(!(await srvFresh())) throw new Error('login');
  DB.qlogs=DB.qlogs||[]; const have=new Set(DB.qlogs.map(r=>r.id)); const sent=srvSent();
  for(let off=0;off<20000;off+=1000){
   const r=await srvFetch('/rest/v1/records?select=*&user_id=eq.'+encodeURIComponent(SRV.uid)+'&order=at.asc&limit=1000&offset='+off); if(!r.ok) throw new Error('HTTP '+r.status);
   const rows=await r.json();
   rows.forEach(x=>{ if(!x||!x.id||have.has(x.id)) return; const q=srvFromRow(x); DB.qlogs.push(q); have.add(q.id); sent[SRV.uid+':'+q.id]=srvHash(JSON.stringify(srvRow(q))); added++; });
   if(rows.length<1000) break;
  }
  if(added){ DB.qlogs.sort((a,b)=>String(a.at).localeCompare(String(b.at))); srvLsSet(SRV_SENT,JSON.stringify(sent)); save(); }
  SRV.pulledAt=Date.now();
 }catch(e){ SRV.err=String((e&&e.message)||e); }
 SRV.pulling=false;
 if(added){ toast(`다른 기기에서 남긴 기록 ${added}건을 가져왔어요`); if(!LIVE&&!PRACTICE) render(); }
 return added;
}
/* ================= 통화 기록 화면 (2026-11-19) =================
   홈에 있던 "안 받음 · 부재 1건"을 이리로 옮겼어요. 내 콜을 돌아보는 곳이에요: 몇 통 걸어 몇 통 연결됐나, 어디서 끊겼나, 통화 하나하나.
   고객을 관리하는 화면이 아니에요. 고객 장부(누구에게 몇 차 콜, 다시 걸 차례, 계약)는 사업단 CRM(TS소셜링크)의 일이라 여기서는 만들지 않아요
   (docs/PURPOSE.md 판단 기준 12). 여기는 통화 한 건이 한 줄이고, 그 통화에서 카톡·장표로 이어져요. 고객 이름은 여전히 이 기기에만 있어요. */
const CLOG={per:'today',f:'all'};
function clogIn(per){ const k=todayKey(); if(per==='today') return r=>String(r.at).slice(0,10)===k; if(per==='week'){ const wk=weekKey(); return r=>weekKey(String(r.at).slice(0,10))===wk; } const ym=k.slice(0,7); return r=>String(r.at).slice(0,7)===ym; }
function clogKind(r){ if(r.connected===false) return 'noans'; if(r.result==='약속') return 'appt'; if(/거절|거부/.test(r.result||'')) return 'no'; return 'again'; }
function clogHTML(){
 const P=myLogs().filter(clogIn(CLOG.per)).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
 const con=P.filter(r=>r.connected), appt=P.filter(r=>r.result==='약속');
 const cnt={all:P.length,noans:0,again:0,appt:0,no:0}; P.forEach(r=>{ cnt[clogKind(r)]++; });
 /* 연결된 통화가 어디서 가장 많이 끊겼나 (약속 빼고) */
 const drops={}; con.filter(r=>r.result!=='약속').forEach(r=>{ const k=STAGE_NAMES[r.stage]||'—'; drops[k]=(drops[k]||0)+1; }); const top=Object.entries(drops).sort((a,b)=>b[1]-a[1])[0];
 const shown=P.filter(r=>CLOG.f==='all'||clogKind(r)===CLOG.f);
 const db=(liveCfg().db)||'퍼미션';
 const tile=(k,n,sub)=>`<div class="ctile"><span class="k">${k}</span><b>${n}</b>${sub?`<span class="sub">${sub}</span>`:''}</div>`;
 const chip=r=>{ const k=clogKind(r); return k==='noans'?'<span class="chip hold">부재</span>':k==='appt'?'<span class="chip ok">약속</span>':k==='no'?`<span class="chip no">${esc(r.result)}</span>`:`<span class="chip">${esc(r.result||'기록')}</span>`; };
 const row=r=>{ const c=r.connected!==false;

function snRefuse(t){ if(!SN_RX.notneed.test(t)) return false; if(/괜찮/.test(t)&&!/(필요\s*없|관심\s*없|안\s*해|됐|싫)/.test(t)&&snParseTime(t)) return false; return true; }
/* 질문 3개 (흐름 3단계). know: 안다/챙겼다, gap: 빈 곳 */

 {id:'silbi',ask:'지금 실비가 몇 세대인지 아세요?',know:/((\d|일|이|삼|사|오)\s*세대|알아요|알죠|알고\s*있|실비\s*없)/,gap:/^\s*(아뇨|아니요|아니오)\s*[.!…]*\s*$/,

 {id:'gov',ask:'병원비가 1년에 많이 나오면 나라에서 돌려주는 돈이 있는데, 신청해 보신 적 있으세요?',know:/(있어요|해\s*봤|받아\s*봤|받았|신청했)/,gap:/(없어요|아뇨|아니요|아니오|안\s*해\s*봤|안\s*했|한\s*적\s*없|못\s*했|처음)/,
  then:'그 돈은 안 찾아가면 3년 지나 사라져요.'},
 {id:'renew',ask:'가지고 계신 보험 중에 갱신형이 있는지 아세요?',know:/(있어요|없어요|알아요|알죠|비갱신)/,gap:/^\s*(아뇨|아니요|아니오)\s*[.!…]*\s*$/,
  then:'갱신 때마다 나이 따라 보험료가 다시 계산돼요.'},

const SN_ORD=['첫 번째요','두 번째요','세 번째요'];
const SN_SKILL={intro:'허락 대신 "1분만"',main:'설명 대신 바로 질문',remember:'"기억 안 나요"는 맞장구 뒤 바로 본론',gap:'"모른다"가 만날 이유',verdict:'부탁 아닌 판정',dates:'날짜는 내가 두 개',place:'장소도 둘 중 하나',recap:'끊기 전 복창',
 busy:'바쁘면 시각만 정하고 끊기',time:'시간 거절은 날짜로',benefit:'불만이 곧 니즈',agent:'담당자보다 관리 공백',visit:'방문 거절엔 한 번, 고객이 얻는 것',phone:'두 번째 방문 거절엔 방문 없는 길',cancel:'해약 전에 먼저 보기',stop:'거절 두 번이면 바로 끝',gift:'사은품은 조건으로 안 걸기',
 notneed:'가벼운 거절은 한 번만 받기',insurance:'보험인 걸 숨기지 않기',selling:'안 해도 된다고 먼저 말하기',duration:'걸리는 시간은 있는 그대로',age:'관심 신호는 바로 날짜로',allknown:'다 알면 소개 부탁하고 끝',daywork:'시간이 안 맞으면 시간을 맞추기',done:'"다 했어요"엔 그 뒤에 바뀐 것',kakao:'카톡은 주되 정리는 만나서',product:'상품 얘기는 먼저 안 꺼내기',cost:'궁금한 건 한 문장으로 답하고 이어 가기',who:'누군지 다시 짧게',bye:'끊겠다면 붙잡지 않기'};

function snNew(pid){
 const p=pid?persona(pid):null;
 const S={id:uid('sr'),userId:ME.id,personaId:pid||'',db:p?p.db:'퍼미션',old:p?/[6-9]0대/.test(p.age||''):false,startedAt:new Date().toISOString().slice(0,16),
  phase:'intro',qi:0,unk:[],known:[],hits:{},no:0,slots:null,slotTries:0,unclear:0,pick:null,pend:null,pref:null,place:null,turns:[],outcome:null};
 const open=p?p.opening:'여보세요.';
 S.turns.push({who:'me',text:open});
 snReply(S,open,true);
 return S;
}
function snSay(S,parts,tags){ parts=parts.filter(Boolean); const text=fill(parts.filter(Boolean).map(x=>x.text||x).join(' ')).replace(/\s+/g,' ').trim(); const why=parts.map(x=>x.why).filter(Boolean);
 S.turns.push({who:'sen',text,why:why.join(' '),tags:tags||[]}); }
function snEnd(S,outcome){ S.outcome=outcome; S.phase='end'; }
const snW=(text,why)=>({text,why});
function snOffer(S,kind,from){ S.slots=snSlots(kind||S.pref||'day',from);
 if(S.wish&&!from){ const w=S.wish; S.wish=null; const h2=w.h>=17?w.h-2:w.h+2; S.slots=[w,snSlot(new Date(w.y,w.mo-1,w.d),h2)]; } S.phase='date'; return `${S.slots[0].say}랑 ${S.slots[1].say} 중에 언제가 편하세요?`; }
function snResume(S){
 if(S.phase==='intro') return snMain(S);
 if(S.phase==='q') return snW(`${SN_ORD[S.qi]}, ${SN_Q[S.qi].ask}`);
 if(S.phase==='date'&&S.slots) return snW(`${S.slots[0].say}랑 ${S.slots[1].say} 중에 언제가 편하세요?`);
 if(S.phase==='place') return snW('댁이랑 근처 카페 중에 어디가 편하세요?');
 return null;
}
function snMain(S){
 if(S.db==='방송'){ return snW('갖고 계신 보험은 그대로 두고, 놓친 보험금은 없는지 같이 봐 드려요. '+snOffer(S),'방송 DB는 고객이 직접 신청했어요. 질문 없이 바로 날짜로 가요. 설명이 길어지면 거절이 나와요.'); }
 S.phase='q'; S.qi=0; S.askedQ=true;
 return snW(`이게 모든 분께 필요한 건 아니라서, 해당되시는지만 볼게요. 첫 번째요, ${SN_Q[0].ask}`,'"모든 분께 필요한 건 아니라서"는 아무한테나 거는 전화가 아니라는 신호예요. 설명하지 않고 바로 질문을 던져요.');
}
function snRecap(S,phone){
 const s=S.pick; snEnd(S,'약속');
 if(phone) return snW(`그럼 ${s.full}에 전화로 설명드릴게요. 끊고 바로 동의 링크 카톡으로 보내 드릴게요.`,'끊기 전에 월·일·요일·시각을 한 번에 복창해요. "연락드릴게요"로 끝난 통화는 흐지부지돼요.');
 return snW(`그럼 ${s.full}, ${S.place}에서 뵙겠습니다. 끊고 바로 카톡으로 명함이랑 위치 보내 드릴게요.`,'끊기 전에 월·일·요일·시각·장소를 한 번에 복창해요. 상세 주소는 묻지 않아요.');
}
/* 거절·질문 받기. 처리했으면 true */
function snObjection(S,t){
 const R=SN_RX, hit=k=>{ S.hits[k]=(S.hits[k]||0)+1; return S.hits[k]; };
 const visit=(R.phone.test(t)||R.visitNo.test(t))&&!R.stop.test(t);
 if(['later','trip','notime','busy','think','agent','done','kakao'].some(k=>R[k].test(t))||(visit&&!S.hits.visit&&S.pend!=='phone')) S.obj=(S.obj||0)+1;
 if(R.stop.test(t)){ snSay(S,[snW('네, 알겠습니다. 먼저 연락드리지 않을게요.','연락하지 말라고 하면 바로 끝내요. 거부한 뒤에 계속 권하면 금소법상 부당권유예요. 마무리 문자도 권유 없이 한 번만.')],['stop']); snEnd(S,'종료'); return true; }
 if(visit&&S.pend!=='phone'){
  if(S.phase==='place'){ hit('visit'); return snPhone(S); }
  const firmV=/(니까|니깐|다고요|라고요|다구요|라구요|싫다고|몇\s*번)/.test(t);
  if(!S.hits.visit&&!firmV){ hit('visit');
   snSay(S,[snW('저 좋자고 뵙는 게 아니라, 만나면 가입 내역을 화면으로 같이 보면서 놓친 보험금을 바로 짚어 드릴 수 있어서요. '+snOffer(S),'방문이 싫다고 하면 한 번은 "고객님이 얻는 것"으로 다시 물어요. 내가 아니라 고객 득을 말해요. 그래도 싫다면 방문 없이.')],['visit','dates']); return true; }
  hit('visit'); return snPhone(S);
 }
 if(snRefuse(t)){
  S.no++;
  // 다그치는 말투("안 한다니까", "싫다고요")면 첫 거절이어도 바로 끝내요
  const firm=/(니까|니깐|다고요|라고요|다구요|라구요|다고\s*했|라고\s*했|몇\s*번|됐다고|싫다고|아\s*진짜|짜증)/.test(t);
  if(S.no>=2||(S.obj||0)>=2||firm){ snSay(S,[snW('네, 알겠습니다. 먼저 연락드리지 않을게요.','"필요 없다"가 두 번이면 바로 끝내요. 거부 뒤에 계속 권하면 금소법상 부당권유예요.')],['stop']); snEnd(S,'종료'); return true; }
  if(!S.askedQ&&!S.firm1){ S.firm1=true; S.askedQ=true; S.phase='q'; S.qi=0;
   snSay(S,[snW('네, 부담 갖지 않으셔도 돼요. 모든 분께 필요한 건 아니라서 몇 가지만 확인하고, 해당 없으시면 말씀하신 대로 바로 끊을게요. 첫 번째요, '+SN_Q[0].ask,'첫 거절엔 날짜를 밀지 않아요. "몇 가지만 보고 아니면 끊겠다"로 부담을 내려 주고, 쉬지 말고 바로 질문으로 가요. 고객 입에서 "모르겠다"가 나오면 그게 만날 이유가 돼요.')],['notneed','main']); return true; }
  const head=S.old?'독감주사도 나라에서 해 주니까 걸리기 전에 맞으시잖아요. 보험도 아프고 나면 고치기 어려워서, 미리 한 번 봐 드리는 거예요.':'독감주사도 걸린 다음에 맞으면 소용없잖아요. 보험도 아프고 나면 고치기 어려워서, 미리 한 번 봐 드리는 거예요.';
  snSay(S,[snW(head+' '+snOffer(S),'가벼운 거절은 한 번만 받아요. 비유 한 문장 + 날짜 두 개. 두 번째 "필요 없다"엔 바로 끝내요.'+(S.old?' 65세 이상은 "나라에서 해 주는 독감주사"로 시작해요.':''))],['notneed','dates']); return true; }
 if(R.remember.test(t)){ hit('remember'); const r=snResume(S); snSay(S,[snW('네~ 기억 안 나실 수 있어요, 맞아요. 빠르게 통화가 이뤄져서 그러실 거예요. 그래서 연락드린 건데요,','기억 못 하는 건 당연해요. 맞장구 한 번 치고 쉬지 말고 바로 본론으로 가요. "기억하세요?"라고 먼저 묻지 않아요.'),r],['remember',S.phase==='q'?'main':'']); return true; }
 if(R.callbackQ.test(t)&&S.turns.filter(x=>x.who==='sen').length===0){ S.phase='intro'; snSay(S,[snW('네, 급한 건 아니에요. CJ온스타일 통해 보장 점검 맡게 된 {내회사} {내이름}인데, 1분만 말씀드릴게요.','부재중 보고 건 고객은 급한 일인 줄 알아요. "급한 건 아니에요"로 먼저 안심시켜요.')],['intro']); return true; }
 if(R.who.test(t)){ const n=hit('who'); const r=S.phase==='intro'?snMain(S):snResume(S); snSay(S,[snW(n>1?'CJ온스타일 통해 상담 맡게 된 {내이름}입니다.':'CJ온스타일 통해 상담 맡게 된 {내회사} {내이름}입니다.','누군지 물으면 소속·이름만 짧게 다시 말하고 바로 이어 가요.'),r],['who']); return true; }
 if(R.number.test(t)){ const r=S.phase==='intro'?snMain(S):snResume(S); snSay(S,[snW(S.db==='방송'?'CJ온스타일 방송 보시고 상담 신청해 주셔서 연락드렸어요.':'CJ온스타일에서 보장 점검 연락에 동의해 주셔서 받은 번호예요.','번호를 어떻게 알았냐고 하면 어디서 왔는지 사실대로 한 문장.'),r],[]); return true; }
 if(R.cancel.test(t)){ snSay(S,[snW('해약하시기 전에 꼭 먼저 보셔야 해요. 한 번 해지하면 같은 조건으로 다시 못 들어요. '+snOffer(S).replace(' 언제가 편하세요?',' 보시죠.'),'해약하려는 고객이 가장 급해요. 놓치지 말고 바로 날짜로.')],['cancel','dates']); return true; }
 if(R.later.test(t)){ const n=hit('later'); if(n>1) return snDefer(S);
  snSay(S,[snW('그럼 날짜만 정해 둘게요. '+snOffer(S,'mix',30).replace(' 언제가 편하세요?','요?')+' 그 전에 바뀌는 건 카톡으로 드릴게요.','"시간 되면 연락 줄게요"로 끝나면 연락이 안 와요. 먼 날이라도 지금 날짜를 잡아요.')],['time','dates']); return true; }
 if(R.trip.test(t)){ const n=hit('trip'); if(n>1) return snDefer(S);
  snSay(S,[snW('네, 그럼 다녀오신 뒤로 잡으면 돼요. '+snOffer(S,S.pref||'eve',15).replace(' 언제가 편하세요?','요?'),'출장은 시간 문제지 필요 없다는 게 아니에요. 다녀온 뒤 날짜로 바로 잡아요.')],['time','dates']); return true; }
 if(R.daywork.test(t)&&S.phase!=='place'){ S.pref='eve'; snSay(S,[snW('그럼 퇴근하시고 저녁에 뵈면 돼요. 댁 아니어도 회사 근처 카페도 괜찮아요. '+snOffer(S,'eve').replace(' 언제가 편하세요?','요?'),'시간이 안 맞는 건 거절이 아니에요. 고객 시간에 맞춰서 날짜 두 개.')],['daywork','dates']); return true; }
 if(R.notime.test(t)){ snSay(S,[snW('그래서 제가 정리해서 보여 드리는 거예요. 보통 30분 안팎이에요. '+snOffer(S).replace(' 언제가 편하세요?','요?'),'"볼 시간이 없다"는 지금 바쁜 게 아니라 부담이 크다는 말이에요. 걸리는 시간을 그대로 말하고 날짜로.')],['time','dates']); return true; }
 if(R.done.test(t)&&!S.hits.done){ hit('done'); S.pend='done'; snSay(S,[snW('상담은 언제 받으셨어요? 그 뒤로 바뀐 게 있어서요.','"다 했어요"는 거절이 아니라 정보예요. 언제였는지 물으면 그 뒤에 바뀐 제도가 만날 이유가 돼요.')],['done']); return true; }
 if(R.cost.test(t)){ const r=snResume(S); snSay(S,[snW('점검은 비용 없어요.','궁금한 건 한 문장으로 답하고 바로 이어 가요.'),r],['cost']); return true; }
 if(R.product.test(t)){ const r=snResume(S); snSay(S,[snW('상품 얘기는 제가 먼저 안 꺼내요. 갖고 계신 것부터 봐 드려요.','경계하는 고객에겐 먼저 선을 그어 줘요.'),r],['product']); return true; }
 if(R.whyMeet.test(t)){ const r=S.phase==='date'?snResume(S):snW(snOffer(S)); snSay(S,[snW('가입 내역을 조회해 봐야 답이 나와서요. 만나서 받을 돈·놓친 돈·새는 돈으로 정리해 보여 드려요.','"왜 만나요?"엔 만나서 보는 게 무엇인지 구체적으로 한 문장.'),r],['verdict','dates']); return true; }
 if(R.kakao.test(t)&&S.pend!=='phone'){ const r=S.phase==='date'?snResume(S):snW(snOffer(S)); snSay(S,[snW('네, 카톡으로 제 명함은 먼저 보내 드릴게요. 정리는 화면을 같이 보면서 설명드려야 정확해서요.','카톡만 보내고 끝내면 흐지부지돼요. 보내 주되 만나는 이유를 한 문장으로.'),r],['kakao','dates']); return true; }
 if(R.busy.test(t)&&S.phase!=='date'&&S.phase!=='place'){ const late=snNow().getHours()>=18; S.cb=late?snSlot(snAdd(snNow(),1),12):snSlot(snNow(),19); S.pend='callback';
  snSay(S,[snW(`네, 그럼 ${S.cb.say}에 1분만 다시 드릴게요.`,'바쁘다면 설명을 이어 가지 말고 다시 걸 시각을 내가 정해요. "몇 시가 편하세요?"로 물으면 "모르겠다"가 나와요.')],['busy']); return true; }
 if(R.think.test(t)){ const n=hit('think'); if(n>1) return snDefer(S);

 if(R.benefit.test(t)){ snSay(S,[snW('그래서 확인해 드리는 거예요. 받을 수 있는데 안 받은 돈, 나라에서 신청해야 주는 돈부터 봐 드려요. '+snOffer(S),'"혜택이 뭐가 있냐"는 불만이 곧 니즈예요. 보험 일반론 설명은 하지 않아요.')],['benefit','dates']); return true; }

 if(S.pend==='phone'){ const c=snParseTime(t);

  if(R.no.test(t)&&!R.yes.test(t)){ const s=snSlots(S.pref||'day',3); S.pick=s[1]; snSay(S,[snW(`그럼 ${S.pick.say}는 어떠세요?`,'안 되면 다른 시각을 내가 하나 더 내놓아요.')],['dates']); return; }

  snSay(S,[snW('그럼 바뀐 건 못 들으셨겠네요. 실비 세대랑 안 받은 보험금만 봐 드릴게요.','먼저 연락이 없었다면 그게 관리 공백이에요. 바꾸자는 게 아니라 빈 곳만 보자고 해요.'),r],['agent']); return; }
 // 날짜·장소를 고르는 중이면 날짜·장소 말이 먼저. 단, 거절·질문이 섞여 있으면 그걸 먼저 받아요("내일부터 출장" ≠ 내일)

  snSay(S,[snW(`${S.slots[0].say}랑 ${S.slots[1].say} 중에 어느 쪽이 나으세요?`,'답이 흐려도 열린 질문으로 바꾸지 않아요. 두 개 중에 고르게 해요.')],['dates']); return; }
 if(S.phase==='place'){ S.place='댁 근처 카페'; snSay(S,[snRecap(S)],['recap']); return; }

function snAnswer(S,t){
 const R=SN_RX, q=SN_Q[S.qi];
 let kind='neutral';
 if(R.unknown.test(t)||(q.gap&&q.gap.test(t))) kind='gap'; else if(q.know.test(t)) kind='know';
 if(kind==='gap') S.unk.push(q.id); else if(kind==='know') S.known.push(q.id);
 const lead=kind==='gap'?snW(q.then,'"모르겠는데요"라고 자기 입으로 말한 순간 궁금증이 생겨요. 설명은 한 문장만 하고 다음으로.'):snW(kind==='know'?'잘 아시네요.':'네.',kind==='know'?'알고 있으면 짧게 인정하고 넘어가요.':'');
 S.qi++;
 if(S.qi<SN_Q.length&&!R.impatient.test(t)){ snSay(S,[lead,snW(`${SN_ORD[S.qi]}, ${SN_Q[S.qi].ask}`,S.qi===1&&kind!=='gap'?'질문은 하나 묻고, 짧게 받고, 다음. 답은 만나서 드려요.':'')],kind==='gap'?['gap']:['main']); return; }
 // 판정 → 날짜
 const asked=S.qi, N=S.unk.length;
 if(!N&&S.known.length>=asked){ snSay(S,[snW('잘 챙기고 계시네요. 주변에 이런 거 모르실 것 같은 가족분 계시면 말씀해 주세요. 들어가세요.','다 알고 있으면 억지로 잡지 않아요. 소개를 부탁하고 정중히 끝내요.')],['allknown']); snEnd(S,'종료'); return; }
 const head=N?`말씀드린 것 중에 ${['','하나','두 개','세 개'][N]}가 처음 들으신 거면 확인해 보셔야 하는 분이에요.`:'말씀드린 것 중에 하나라도 처음 들으신 거면 확인해 보셔야 하는 분이에요.';

function snDate(S,t){
 const R=SN_RX; let pick=null;
 const s0=S.slots[0], c=snParseTime(t,new Date(s0.y,s0.mo-1,s0.d));
 if(c&&!c.dayOnly) pick=c.slot;
 else if(R.first.test(t)) pick=S.slots[0]; else if(R.second.test(t)) pick=S.slots[1];
 else { const wd=(t.match(/(월|화|수|목|금|토|일)요일/)||[])[0]; if(wd){ pick=S.slots.find(s=>s.wd===wd)||null; } }
 if(!pick&&c&&c.dayOnly){ const d=new Date(c.slot.y,c.slot.mo-1,c.slot.d); const we=d.getDay()===0||d.getDay()===6; S.slots=[snSlot(d,we?11:14),snSlot(d,we?15:19)];
  snSay(S,[snW(`그럼 ${S.slots[0].say}랑 ${S.slots[1].say} 중에는요?`,'요일만 말하면 그날 안에서 시각 두 개를 내놓아요.')],['dates']); return true; }
 if(pick){ S.pick=pick; S.phase='place'; snSay(S,[snW(`네, ${pick.say}로 할게요. 댁이랑 근처 카페 중에 어디가 편하세요?`,'장소도 두 개 중에 고르게 해요. 상세 주소는 묻지 않아요.')],['place']); return true; }
 const pf=snPref(t);
 if(pf&&!R.yes.test(t)){ snSay(S,[snW('그럼 '+snOffer(S,pf).replace(' 언제가 편하세요?',' 중에는요?').replace(' 중에 중에는요?',' 중에는요?'),'고객이 말한 때에 맞춰 다시 두 개를 내놓아요.')],['dates']); return true; }

  if(S.slotTries>=3){ return snDefer(S); }

 if(R.yes.test(t)&&!R.no.test(t)&&!SN_NEG.test(t)){ S.pick=S.slots[0]; S.phase='place'; snSay(S,[snW(`그럼 ${S.pick.say}로 잡을게요. 댁이랑 근처 카페 중에 어디가 편하세요?`,'"네"만 하면 앞의 날로 정하고 바로 장소로 넘어가요.')],['place']); return true; }
 return false;
}
function snPlace(S,t){
 const R=SN_RX;
 if(R.phone.test(t)||/전화로/.test(t)){ snSay(S,[snRecap(S,true)],['phone','recap']); return true; }
 if(/(집|댁)/.test(t)&&!/(카페|근처)/.test(t)) S.place='댁';
 else if(/(가게|매장|사무실)/.test(t)) S.place=t.match(/(가게|매장|사무실)/)[1];
 else if(/회사|직장/.test(t)) S.place='회사 근처 카페';
 else if(/(카페|근처|아무|상관|편한\s*(데|곳))/.test(t)||(R.yes.test(t)&&!SN_NEG.test(t))) S.place='댁 근처 카페';
 else { if(snParseTime(t)){ S.phase='date'; return snDate(S,t); } return false; }
 snSay(S,[snRecap(S)],['recap']); return true;
}

const SN_GUIDE="너는 보험 설계사 교육 앱의 \"선배 시범\"에서 선배 설계사 역할을 해. 연습하는 사람이 고객 역을 하고, 너는 CJ온스타일에서 넘어온 고객에게 처음 전화를 건 선배야. 목적은 후배가 \"거절을 이렇게 받는구나\"를 보고 배우는 것이야.\n\n[이 통화의 목적]\n만나서 보험을 점검할 약속을 잡는 것. 단, 고객이 원하지 않으면 정중히 끝내는 것도 좋은 통화야. 억지로 잡은 약속은 실패야.\n\n[먼저 고객 말을 제대로 알아들어]\n- 고객이 한 말이 동의인지, 거절인지, 질문인지, 망설임인지 먼저 판단해. \"괜찮아요\", \"아 괜찮습니다\", \"됐어요\", \"아뇨\"는 대부분 거절이야. \"월요일 괜찮아요\"처럼 날짜를 받아들이는 말만 동의야.\n- 애매하면 동의로 치지 마.\n\n[거절을 받는 원칙]\n- 첫 거절: 공감 한마디 → 무슨 전화인지 한 문장 → 부담을 낮추는 말(\"모든 분께 필요한 건 아니라서, 해당되시는지만 볼게요\") → 질문 하나. 첫 거절에 날짜부터 밀지 마.\n- 이유가 있는 거절은 그 이유에 맞게 받아: 바쁘다 → 다시 걸 시각만 정하고 끊기 / 시간이 없다·출장 → 날짜 문제로 바꾸기 / 담당자가 있다 → 깎아내리지 말고 관리 공백 묻기 / 방문이 싫다 → 처음엔 \"저 좋자고가 아니라\" 만나면 고객이 얻는 것(가입 내역을 화면으로 같이 보며 놓친 보험금을 바로 짚어 드림)을 한 문장으로 말하고 날짜 두 개로 한 번 더 물어, 두 번째로 싫다면 방문 없는 길(동의 링크 + 전화 설명) / 보험료 부담·해약 → 해약 전에 먼저 보기 / 혜택이 없다 → 불만이 곧 이유.\n- 방문이 싫다는 건 만나는 방식에 대한 말이라 \"필요 없다\" 거절 횟수에 세지 마.\n- 이유 없는 첫 거절(\"안 할게요\", \"괜찮아요\")도 한 번은 받아: \"모든 분께 필요한 건 아니라서 몇 가지만 확인하고, 해당 없으시면 말씀하신 대로 바로 끊을게요\" 하고 쉬지 말고 바로 질문 하나로 이어 가.\n- 두 번째 거절이거나, 다그치는 말투(\"~니까\", \"~다고요\"), \"전화하지 마세요\"면 바로 정중히 끝내. 거부한 뒤 계속 권하면 금소법상 부당권유야.\n- 고객이 질문하면 한 문장으로 바로 답하고 이어 가.\n\n[말하는 법]\n- 실제 전화처럼 존댓말, 짧게. 한 번에 1~3문장, 130자 이내. 혼자 15초 넘게 말하지 마.\n- 같은 말을 되풀이하지 말고, 고객이 방금 한 말을 받아서 이어 가.\n- 날짜는 앱이 준 두 개 중에서 고르게 해(\"A랑 B 중에 언제가 편하세요?\"). 다른 날짜를 만들지 마. \"언제가 편하세요?\"만 묻지 마.\n- 약속을 확정할 때는 고객이 분명히 고른 날짜·시각과 장소를 한 번에 복창해.\n- 숫자는 본보기의 [근거 숫자]에 있는 것만 써. 확실하지 않은 건 단정하지 마(\"무조건 이득\", \"크게 손해\" 금지).\n- 보험인 걸 숨기지 마(\"보험 때문은 아니고요\", \"판매 목적은 아니고요\" 금지). 다른 설계사를 깎아내리지 마. 해피콜 답을 코칭하지 마.\n- 첫마디에 \"통화 괜찮으세요?\", \"기억하세요?\"처럼 허락·기억을 묻지 마.\n- [금지 멘트]에 있는 말은 쓰지 마.\n\n[답하는 모양]\nJSON 하나로만 답해.\n- say: 선배가 지금 할 말\n- why: 후배에게 보여 줄 \"왜 이렇게 말했나\" 한 줄 (60자 안팎)\n- intent: 이 말로 하려는 것\n  continue(이어 가기) / propose_dates(날짜 두 개 제안) / confirm(고객이 고른 약속을 복창하며 확정) / end_polite(정중히 끝내기) / end_callback(다시 걸 시각을 정하고 끝내기)\nconfirm은 고객이 날짜를 분명히 골랐을 때만 써.";

 }

 // 이번 턴에 규칙이 날짜를 정했으면(고객이 골랐다고 봄) AI 말에도 그 날짜가 있어야 해요. 아니면 AI는 고객이 안 골랐다고 본 것이라 규칙 말을 써요

 // 날짜·숫자: 준 것만
 const allowed=[...(S.slots||[]),...(S.alt||[]),S.pick,S.cb,...snSlots(S.pref||'day')].filter(Boolean).map(s=>s.say+' '+s.full).join(' ');
 // 날과 시각을 한 덩어리로 봐요("수요일 오후 5시"는 수요일이 있어도 5시가 없으면 안 돼요)
 const DT=/(\d+월\s*\d+일\s*)?((월|화|수|목|금|토|일)요일|오늘|내일|모레)(\s*(오전|오후|저녁|낮|밤|아침)?\s*\d{1,2}\s*시(\s*반)?)?|(오전|오후|저녁|낮|밤|아침)\s*\d{1,2}\s*시(\s*반)?|\d+월\s*\d+일/g;
 for(const w of (say.match(DT)||[])) if(!allowed.includes(w.replace(/\s+/g,' ').trim())) return {ok:false,why:'준 적 없는 날짜: '+w};
 const nums=snKB()+' '+allowed+' 1분 15초';
 for(const n of (say.match(/\d+(?:[.,]\d+)?/g)||[])) if(!nums.includes(n)) return {ok:false,why:'근거 없는 숫자: '+n};
 return {ok:true,say,why:fill(String(r.why||'')).trim(),intent};
}
async function snAsk(S,turns,rule){
 const payload={turns:turns.map(t=>({who:t.who,text:t.text})),kb:snKB(),brief:snBrief(S,rule)};
 if(typeof window!=='undefined'&&window.__SN_AI) return await window.__SN_AI(payload);
 if(SAMPLE){
  const talk=payload.turns.map(t=>(t.who==='sen'?'선배: ':'고객: ')+t.text).join('\n');
  const prompt=[SN_GUIDE,payload.kb,payload.brief,'[지금까지 대화]\n'+talk,
   '위 대화에 이어 선배가 할 다음 말을 정해. 다른 글 없이 JSON 하나로만 답해: {"say":"…","why":"…","intent":"continue|propose_dates|confirm|end_polite|end_callback"}'].join('\n\n');
  try{ return await SAMPLE.json(prompt,{modelTier:'default',cache:false}); }
  catch(e){ const c=e&&e.code; if(c==='not_granted'){ S.aiOff=true; toast('Claude 사용을 허락하지 않아서 기본 선배로 이어 가요.'); } else if(c==='rate_limited'){ S.aiOff=true; toast('내 Claude 사용량이 많아 잠시 기본 선배로 이어 가요.'); } throw e; }
 }
 if(!(await srvFresh())) throw new Error('login');
 const res=await fetch(SRV.url+'/functions/v1/senior',{method:'POST',headers:{apikey:SRV.key,Authorization:'Bearer '+SRV.ses.at,'Content-Type':'application/json'},body:JSON.stringify(payload)});
 if(res.status===429){ S.aiOff=true; toast('오늘 AI 선배 횟수를 다 썼어요. 기본 선배로 이어 가요.'); throw new Error('limit'); }
 if(res.status===404||res.status===401||res.status===403){ S.aiOff=true; throw new Error('AI '+res.status); }
 if(!res.ok) throw new Error('AI '+res.status);
 return await res.json();
}
/* 한 턴: 규칙 선배가 먼저 답을 만들어 두고(상태도 갱신), AI 답이 검사를 통과하면 그 말로 바꿔요. */
async function snTurn(S,text,redraw){
 S.turns.push({who:'me',text});
 const n0=S.turns.length, pick0=S.pick, snap={phase:S.phase,pick:S.pick,place:S.place,outcome:S.outcome,slots:S.slots}; snReply(S,text);
 const rule=S.turns.length>n0?S.turns[S.turns.length-1]:null;
 if(!rule||rule.who!=='sen'||!snAiOn(S)) return;
 const hist=S.turns.slice(0,-1);
 rule.pending=true; S.busy=true; if(redraw) redraw();
 try{
  const r=await Promise.race([snAsk(S,hist,rule),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),SAMPLE&&!(typeof window!=='undefined'&&window.__SN_AI)?SN_AI_WAIT_SAMPLE:SN_AI_WAIT))]);
  let g=snGuard(S,r,S.pick!==pick0);
  // 규칙은 "고객이 날짜를 골랐다"고 읽었는데 AI는 아니라고 보면, 약속을 안 잡는 쪽(AI)을 믿고 날짜를 되돌려요
  if(!g.ok&&g.why==='정한 날짜와 다름'&&r&&r.intent!=='confirm'){ const post={phase:S.phase,pick:S.pick,place:S.place,outcome:S.outcome,slots:S.slots}; Object.assign(S,snap); g=snGuard(S,r,false); if(!g.ok) Object.assign(S,post); }
  if(g.ok&&S.alt&&g.say.includes(S.alt[0].say)&&g.say.includes(S.alt[1].say)){ S.slots=S.alt; S.phase='date'; S.slotTries=(S.slotTries||0)+1; }
  if(g.ok){ rule.ruleText=rule.text; rule.text=g.say; rule.why=g.why||rule.why; rule.ai=true; S.aiFail=0;
   if(g.intent==='end_polite'&&!S.outcome){ rule.tags=[...(rule.tags||[]),'bye']; snEnd(S,'종료'); }
   if(g.intent==='end_callback'&&!S.outcome){ rule.tags=[...(rule.tags||[]),'busy']; snEnd(S,'다시 전화'); } }
  else { rule.aiReject=g.why; }
 }catch(e){ S.aiFail=(S.aiFail||0)+1; if(S.aiFail>=2) S.aiOff=true; }
 finally{ rule.pending=false; S.busy=false; }
}

function newState(){ return {stage:'intro',obj:0,handled:0,strikes:0,miss:0,idle:0,ready:false,noIntro:0}; }
function handles(p,lvId,text){
 let keyHit=false; try{ keyHit=new RegExp(p.keys).test(text);}catch(e){}
 const num=RX.number.test(text), q=RX.question.test(text), emp=RX.empathy.test(text);
 if(lvId==='L1') return keyHit||num||q||emp;
 if(lvId==='L2') return keyHit||num||q;
 return keyHit||(num&&q);
}
function demoReply(sess,text){
 const p=persona(sess.personaId), lv=LEVELS.find(l=>l.id===p.level), st=sess.state;
 const maxLen=p.maxLen||lv.maxLen, need=Math.min(lv.need,p.objections.length);
 const myTurns=sess.turns.filter(t=>t.who==='me').length;
 if(myTurns>12) return {text:'생각해볼게요. 끊을게요.',end:'보류'};
 if(st.stage==='intro'){
  if(!isIntro(text)){ st.noIntro++; if(st.noIntro>=2) return {text:'모르는 번호라서요. 끊을게요.',end:'끊음'}; return {text:'누구세요?'}; }

 if(text.length>maxLen){ st.strikes++; if(st.strikes>=lv.strike) return {text:'아 길게 말씀하시면… 제가 지금 바빠서 끊을게요.',end:'끊음'}; return {text:'아 길게 말씀하시면 좀… 제가 지금 바빠서요.'}; }
 const date=RX.date.test(text);
 if(!st.ready && handles(p,lv.id,text)){
  st.handled++; st.obj++;
  if(st.handled>=need || st.obj>=p.objections.length){ st.ready=true;
   if(date || p.acceptOnKeys) return {text:p.accept,end:'약속'};
   return {text:(p.soft[st.handled-1]||p.soft[0])+' '+p.ready};
  }
  return {text:(p.soft[st.handled-1]||p.soft[0])+' '+p.objections[st.obj]};
 }
 if(date){
  if(st.ready || st.handled>=need) return {text:p.accept,end:'약속'};
  st.miss++; if(st.miss>=3) return {text:p.refuse,end:'거절'};
  return {text:'아니 날짜보다요, '+p.objections[Math.min(st.obj,p.objections.length-1)]};
 }
 if(st.ready){ st.idle++; if(st.idle>=2) return {text:'생각해볼게요.',end:'보류'}; return {text:'그래서 언제요?'}; }
 st.miss++; if(st.miss>=3) return {text:p.refuse,end:'거절'};
 const v=p.vague[(st.miss-1)%p.vague.length];
 return {text:st.miss===2? v+' '+p.objections[Math.min(st.obj,p.objections.length-1)] : v};

/* ================= 7. 채점 (규칙 루브릭 100점) ================= */
function scoreTurns(meTexts,ctx){
 // ctx: {handled, need, outcome, acceptOnKeys}
 const items=[]; const first=meTexts[0]||'', second=meTexts[1]||'';
 const intro=isIntro(first), purpose=RX.purpose.test(first)?10:(RX.purpose.test(second)?5:0);
 items.push({k:'첫마디: 소속·이름 + 용건',max:20,pt:(intro?10:0)+purpose,c:intro? (purpose===10?'소속·이름과 용건이 첫마디에 있어요.':'용건이 늦었어요. 첫마디에 용건 한 줄.') : '첫마디에 소속·이름부터 말해요.'});
 const q=meTexts.slice(0,3).some(t=>RX.question.test(t));
 items.push({k:'질문으로 대화 끌기',max:15,pt:q?15:0,c:q?'초반에 질문으로 고객을 대화에 끌어들였어요.':'처음 세 번 안에 질문이 없어요. 설명보다 질문 하나.'});
 const need=Math.max(1,ctx.need||1), h=Math.min(ctx.handled||0,need);
 items.push({k:'거절 받아치기',max:20,pt:Math.round(20*h/need),c:h>=need?'거절을 숫자·질문·대안으로 받아쳤어요.':`거절 ${need}번 중 ${h}번만 받아쳤어요. 고객 말을 그대로 받아 숫자나 질문으로.`});
 const dateTexts=meTexts.filter(t=>RX.date.test(t)); let dp=0;
 if(ctx.acceptOnKeys && ctx.outcome==='약속') dp=20; else if(dateTexts.length){ dp=12; if(dateTexts.some(t=>RX.twoOpt.test(t))) dp=20; }
 items.push({k:'날짜 제시 (양자택일)',max:20,pt:dp,c:dp===20?'구체 날짜를 두 개 중에 고르게 했어요.':(dp?'날짜는 냈는데 하나만 냈어요. "A랑 B 중에"로.':'끝까지 날짜·시각을 제안하지 않았어요.')});
 const longest=meTexts.reduce((m,t)=>Math.max(m,t.length),0); const lp=longest<=100?10:(longest<=140?5:0);
 items.push({k:'짧게 말하기',max:10,pt:lp,c:lp===10?'한 번에 짧게 말했어요.':`가장 긴 말이 ${longest}자예요. 한 번에 1~2문장.`});
 const hits=[]; meTexts.forEach(t=>banHits(t).forEach(b=>hits.push(b)));
 const bp=Math.max(0,15-5*hits.length);
 items.push({k:'금지 멘트 0회',max:15,pt:bp,c:hits.length?`금지 멘트 ${hits.length}회.`:'금지 멘트가 없어요.'});
 const total=items.reduce((s,i)=>s+i.pt,0);
 const tips=[]; if(meTexts.some(t=>RX.sorry.test(t))) tips.push('사과할 일이 아니면 "죄송"은 빼요.');
 return {items,total,banHits:hits,tips};
}

  const passes=ss_.filter(s=>s.pass).length; out[lv.id]={recent:ss_.map(s=>!!s.pass).reverse(),passes,cleared:passes>=3}; }

function parseTranscript(text){
 const lines=String(text||'').split(/\r?\n/); const out=[]; let cur=null;
 const head=/^\s*(참석자\s*\d+|화자\s*\d+|Speaker\s*\d+)\s*(?:\/\s*([\d:]+))?\s*$/i;
 const inline=/^\s*(나|설계사|고객|상담사)\s*[:：]\s*(.*)$/;
 for(const raw of lines){ const l=raw.trim(); if(!l) continue; let m=l.match(head);
  if(m){ cur={spk:m[1].replace(/\s+/g,' '),time:m[2]||'',text:''}; out.push(cur); continue; }
  m=l.match(inline); if(m){ cur={spk:/(나|설계사|상담사)/.test(m[1])?'나':'고객',time:'',text:m[2]}; out.push(cur); continue; }
  if(!cur){ cur={spk:'알 수 없음',time:'',text:''}; out.push(cur); }
  cur.text+=(cur.text?' ':'')+l; }
 return out.filter(u=>u.text);
}
function guessMe(utts){
 const sp=[...new Set(utts.map(u=>u.spk))]; if(sp.includes('나')) return '나';
 const hit=utts.find(u=>/(담당|센터|TS|배정|설계사|이라고 합니다|CJ)/.test(u.text)); if(hit) return hit.spk;
 const len={}; utts.forEach(u=>len[u.spk]=(len[u.spk]||0)+u.text.length); return sp.sort((a,b)=>(len[b]||0)-(len[a]||0))[0]||'';
}
function analyzeCall(text,mySpk,names){
 const masked=maskText(text,names); const utts=parseTranscript(masked); const me=mySpk||guessMe(utts);
 const mine=utts.filter(u=>u.spk===me), cust=utts.filter(u=>u.spk!==me);
 const checks=[];
 const f=mine[0]?mine[0].text:'';
 checks.push(isIntro(f)?{ok:true,t:'첫마디에 소속·이름을 밝혔어요.'}:{ok:false,t:'첫마디에 소속·이름이 없어요.'});
 const hits=[]; mine.forEach(u=>banHits(u.text).forEach(b=>hits.push({...b,time:u.time})));
 const longs=mine.filter(u=>u.text.length>150);
 if(longs.length) checks.push({ok:false,t:`혼자 길게 말한 곳 ${longs.length}군데 (${longs.map(u=>u.time||'').filter(Boolean).join(', ')||'시간 없음'}). 한 번에 1~2문장.`}); else checks.push({ok:true,t:'혼자 길게 말한 곳이 없어요.'});
 let refusals=0, afterTalk=0; for(const u of utts){ if(u.spk!==me && RX.refusal.test(u.text)) refusals++; else if(u.spk===me && refusals>=2) afterTalk+=u.text.length; }
 if(refusals>=2 && afterTalk>150) checks.push({ok:false,t:`고객이 거절 신호를 ${refusals}번 줬는데 그 뒤로도 ${afterTalk}자를 더 말했어요. 두 번이면 시각만 받고 끊기.`});
 else if(refusals>=2) checks.push({ok:true,t:`거절 신호 ${refusals}번 뒤에 짧게 정리했어요.`});
 const dates=mine.filter(u=>RX.date.test(u.text));
 checks.push(dates.length?{ok:true,t:'날짜·시각을 제안했어요'+(dates.some(u=>RX.twoOpt.test(u.text))?' (양자택일).':'. 다음엔 두 개 중에 고르게.')}:{ok:false,t:'날짜·시각 제안이 없어요.'});
 const tail=mine.slice(-2).map(u=>u.text).join(' ');
 checks.push(RX.date.test(tail)?{ok:true,t:'끝날 때 다음 연락 시점을 다시 말했어요.'}:{ok:false,t:'끊기 전에 날짜·요일·시각을 복창하지 않았어요.'});
 const sorry=mine.filter(u=>RX.sorry.test(u.text)).length; if(sorry) checks.push({ok:false,t:`"죄송"을 ${sorry}번 썼어요. 사과할 일이 아니면 빼요.`});
 let handled=0; let lastRef=false; for(const u of utts){ if(u.spk!==me){ lastRef=RX.refusal.test(u.text); } else if(lastRef){ if(RX.number.test(u.text)||RX.question.test(u.text)||RX.empathy.test(u.text)) handled++; lastRef=false; } }
 const sc=scoreTurns(mine.map(u=>u.text),{handled,need:Math.max(1,Math.min(2,refusals)),outcome:''});
 return {masked,utts,me,checks,banHits:hits,score:sc};
}

 const pend=DB.proposals.filter(p=>p.status==='pending');
 const agents=DB.users;

 <div class="card"><h2>사용자 현황</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>이름</th><th>역할</th><th>단계</th><th>연습</th><th>평균</th><th>합격</th><th>피드백 받은 콜</th><th>약속 전환</th><th>자주 걸린 금지 멘트</th></tr></thead><tbody>
 ${agents.map(u=>{const s=userStats(u); return `<tr><td><button class="btn sm" data-u="${u.id}">${esc(u.name)}</button></td><td>${esc({admin:'관리자',manager:'매니저',agent:'설계사'}[u.role])}</td><td>${esc(s.stage)}</td><td>${s.n}</td><td>${s.avg}</td><td>${s.pass}</td><td>${s.calls}</td><td>${s.conv}%</td><td class="sub">${esc(s.top||'-')}</td></tr>`;}).join('')}</tbody></table></div></div>
 <div id="admUser"></div>

 ${isAdmin()?`<div class="grid g2" style="margin-top:14px"><div class="card"><h2>AI 고객 설정 추가</h2>
  <div class="grid g2"><div class="field"><label class="f" for="npLv">단계</label><select class="t" id="npLv">${LEVELS.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class="field"><label class="f" for="npDb">DB</label><select class="t" id="npDb"><option>퍼미션</option><option>방송</option><option>기존고객</option></select></div></div>
  <div class="grid g2"><div class="field"><label class="f" for="npName">가명</label><input class="t" id="npName" placeholder="예: 정○○"></div><div class="field"><label class="f" for="npAge">나이·성별</label><input class="t" id="npAge" placeholder="예: 50대 여성"></div></div>
  <div class="field"><label class="f" for="npKnown">설계사가 아는 정보</label><input class="t" id="npKnown" placeholder="예: 보장분석 동의로 넘어온 고객"></div>
  <div class="field"><label class="f" for="npHidden">속마음</label><input class="t" id="npHidden" placeholder="예: 보험이 너무 많아서 줄이고 싶음"></div>
  <div class="field"><label class="f" for="npObj">거절 문장 (한 줄에 하나, 순서대로)</label><textarea class="t" id="npObj" style="min-height:80px"></textarea></div>
  <div class="field"><label class="f" for="npKeys">받아주는 말 (쉼표로)</label><input class="t" id="npKeys" placeholder="예: 겹치는, 새는, 줄이"></div>
  <div class="field"><label class="f" for="npHint">코칭 한 줄</label><input class="t" id="npHint"></div>

  <h2 style="margin-top:16px">데이터</h2><p class="sub">전체 데이터를 백업 파일로 내보내고 가져와요. 다른 사람에게 앱을 줄 때는 이 HTML 파일만 주면 빈 상태로 시작해요.</p>
  <div class="row"><button class="btn" id="exp">내보내기</button><label class="btn" for="impFile">가져오기</label><input type="file" id="impFile" accept="application/json" class="sr"><button class="btn red" id="rst">처음 상태로</button></div></div></div>`:''}`;
 $$('[data-u]',v).forEach(b=>b.addEventListener('click',()=>{ ADM_USER=b.dataset.u; admUserDetail(); }));
 if(ADM_USER) admUserDetail();
 $$('[data-ok]',v).forEach(b=>b.addEventListener('click',()=>approve(b.dataset.ok,true)));
 $$('[data-no]',v).forEach(b=>b.addEventListener('click',()=>approve(b.dataset.no,false)));
 adminDataCards(v);
 if(!isAdmin()) return;

  save(); toast('AI 고객을 추가했어요'); adminView(v); });
 $('#nuAdd').addEventListener('click',()=>{ const name=$('#nuName').value.trim(), pin=$('#nuPin').value.trim(); if(!name){ toast('이름을 넣어 주세요'); return; } DB.users.push({id:uid('u'),name,role:$('#nuRole').value,team:ME.team,pin,phone:''}); save(); toast('사용자를 추가했어요'); adminView(v); });
 $('#exp').addEventListener('click',()=>download('call-allinone-'+today()+'.json',JSON.stringify(DB,null,1)));
 $('#impFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.version!==1) throw new Error('버전이 달라요'); DB=d; save(); toast('가져왔어요'); render(); }catch(err){ toast('가져오기 실패: '+err.message); } }; r.readAsText(f); });
 $('#rst').addEventListener('click',()=>askYes('모든 기록을 지우고 데모 상태로 돌릴까요?',()=>{ resetDB(); ME=userById(ME.id)||DB.users[0]; render(); toast('처음 상태로 돌렸어요'); },'지우기'));

function admUserDetail(){
 const u=userById(ADM_USER); const box=$('#admUser'); if(!u||!box) return;
 const ss_=DB.sessions.filter(s=>s.userId===u.id).slice().reverse(); const cs=DB.calls.filter(c=>c.userId===u.id).slice().reverse();
 const st=levelStatus(u.id);
 box.innerHTML=`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(u.name)} 상세</h2>${isAdmin()&&u.role==='agent'?`<button class="btn sm" id="unlockV">${u.unlockVoice?'음성 잠그기':'음성 단계 열어주기'}</button>`:''}</div>
 <p class="sub">현재 ${esc(st.current)} · 초급 ${st.L1.passes}/5 · 중급 ${st.L2.passes}/5 · 상급 ${st.L3.passes}/5</p>
 <div class="grid g2"><div><h3>최근 연습</h3>${ss_.slice(0,8).map(s=>{const p=persona(s.personaId)||{}; return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>${esc(lvName(s.level))} · ${esc(p.name||'')} <span class="sub">${esc(s.outcome||'')}</span></span><span class="chip ${s.pass?'ok':'no'}">${s.score}점</span></div>${(s.banHits||[]).length?`<p class="sub" style="margin:2px 0">금지: ${esc(s.banHits.map(b=>typeof b==='string'?b:b.label).join(', '))}</p>`:''}`;}).join('')||'<p class="empty">없음</p>'}</div>
 <div><h3>최근 피드백 받은 콜</h3>${cs.slice(0,8).map(c=>`<div style="border-bottom:1px solid var(--line);padding:4px 0"><span class="chip ${/약속/.test(c.result)?'ok':'hold'}">${esc(c.result)}</span> <span class="sub">${fmt(c.date)}</span><p class="sub" style="margin:2px 0">${esc(c.feedback).slice(0,120)}</p></div>`).join('')||'<p class="empty">없음</p>'}</div></div></div>`;
 const ub=$('#unlockV'); if(ub) ub.addEventListener('click',()=>{ u.unlockVoice=!u.unlockVoice; save(); admUserDetail(); });
}
function approve(id,ok){
 const p=DB.proposals.find(x=>x.id===id); if(!p) return; p.status=ok?'approved':'rejected'; p.decidedAt=today(); p.decidedBy=ME.id;
 if(ok){ const pb=DB.playbook;
  if(p.type==='react'||p.type==='lesson') pb.reacts.push({trigger:p.trigger,say:p.say,note:(p.note?p.note+' · ':'')+'제안 승인 '+today(),own:true});
  if(p.type==='ban'){ pb.bans.push({bad:p.trigger,fix:p.say,full:p.trigger+' → '+p.say,own:true}); pb.banRules.push({id:uid('b'),pattern:p.trigger.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),label:p.trigger,fix:p.say}); }
  if(p.type==='template') pb.templates.push({id:uid('t'),title:p.trigger,when:p.note||'',att:'',text:p.say,own:true});
 }
 save(); toast(ok?'승인했어요. 멘트에 들어갔어요':'반려했어요'); render();
}

 const voices=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(x=>/ko/i.test(x.lang)):[];
 const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);

 <div class="field"><label class="f" for="aiModel">모델</label><select class="t" id="aiModel">${['claude-sonnet-5-5','claude-opus-5-5','claude-haiku-5-5'].map(m=>`<option ${s.model===m?'selected':''}>${m}</option>`).join('')}</select></div></details>
 <div class="row"><button class="btn pri" id="aiSave">저장</button><button class="btn" id="aiTest">연결 테스트</button><button class="btn red" id="aiClear">키 지우기</button></div>
 <p class="sub" style="margin-top:10px">AI에는 고객 이름·번호를 가린 내용만 보내요.</p></div>
 <div class="card"><h2>관리</h2><p class="sub">다른 사람이 보낸 기록 합치기, 확인이 필요한 기록 보기, 전체 백업이 있어요.</p><div class="row" style="margin-top:8px"><button class="btn" data-goto="admin">관리 열기</button></div></div>
 <div class="card"><h2>음성</h2><p class="sub">음성 인식: ${sr?'<span class="chip ok">지원</span>':'<span class="chip no">미지원 (크롬 권장)</span>'} · 한국어 목소리 ${voices.length}개</p>
 <div class="field"><label class="f" for="vName">고객 목소리</label><select class="t" id="vName"><option value="">기본</option>${voices.map(x=>`<option ${s.voice===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label class="f" for="vRate">말 빠르기 <b id="vRateV">${(+s.rate||1).toFixed(1)}배</b></label><input id="vRate" type="range" min="0.8" max="3" step="0.1" value="${s.rate||1}" style="width:100%"><p class="sub" style="margin:2px 0 0">0.8배 ~ 3배. 실제 고객처럼 빠르게 들으려면 1.5배 이상. 목소리에 따라 너무 빠르면 더 안 빨라질 수 있어요.</p></div>
 <div class="row"><button class="btn" id="vTest">목소리 들어보기</button></div>

 <h2 style="margin-top:14px">내 정보</h2><div class="field"><label class="f" for="myPhone">내 번호 (카톡 템플릿에 들어가요)</label><input class="t" id="myPhone" value="${esc(ME.phone||'')}" placeholder="010-0000-0000"></div>
 <div class="field"><label class="f" for="myCo">회사 (대사에 들어가요)</label><input class="t" id="myCo" value="${esc(ME.company||'')}" placeholder="예: 메타리치"></div>

 $('#aiTest',v).addEventListener('click',async()=>{ const k=$('#aiKey').value.trim(); if(k) ss('cai.key',k); s.model=$('#aiModel').value; try{ const t=await callClaude('한 단어로만 답해.',[{role:'user',content:'연결 확인. "성공"이라고만 답해.'}],10); toast('연결됨: '+t); }catch(e){ toast(e.message); } });
 $('#vTest',v).addEventListener('click',()=>{ s.voice=$('#vName').value; s.rate=+$('#vRate').value; speak('네 여보세요? 누구세요?'); });

 $('#vRate',v).addEventListener('change',()=>speak('네 여보세요? 누구세요?'));
 $('#vName',v).addEventListener('change',e=>{ s.voice=e.target.value; save(); });
 $('#meSave',v).addEventListener('click',()=>{ ME.phone=$('#myPhone').value.trim(); ME.company=$('#myCo').value.trim(); save(); toast('저장했어요'); });
 /* 밝게/어둡게 버튼은 뺐어요(2026-11-22). 앱은 늘 밝은 화면이에요. 저장 옆에 있어 잘못 눌려 화면이 검게 바뀌었어요. */
}

/* ================= 10. 음성 ================= */
let REC=null;
function speak_v0(text){ try{ if(!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; const vs=speechSynthesis.getVoices(); const pick=vs.find(x=>x.name===DB.settings.voice)||vs.find(x=>/ko/i.test(x.lang)); if(pick) u.voice=pick; u.rate=DB.settings.rate||1; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function stopVoice(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); if(REC){ REC.abort(); REC=null; } }catch(e){} }
function toggleListen_v0(btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast('이 브라우저는 음성 인식이 안 돼요. 크롬에서 열어 주세요'); return; }
 if(REC){ REC.stop(); return; }
 try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
 REC=new SR(); REC.lang='ko-KR'; REC.interimResults=false; REC.maxAlternatives=1;
 btn.setAttribute('aria-pressed','true'); btn.textContent='■ 듣는 중';
 REC.onresult=e=>{ const t=e.results[0][0].transcript; const ta=$('#say'); if(ta){ ta.value=t; sendTurn(); } };
 REC.onerror=e=>toast('음성 인식 오류: '+e.error);
 REC.onend=()=>{ REC=null; const b=$('#mic'); if(b){ b.setAttribute('aria-pressed','false'); b.textContent='🎙 말하기'; } };
 REC.start();
}
if('speechSynthesis' in window){ try{ speechSynthesis.onvoiceschanged=()=>{ if(VIEW==='settings'&&ME) render(); }; }catch(e){} }

(function(){ const id=lsMe()||ss('cai.me')||DB.meId; if(id){ const u=userById(id); if(u&&!isEx(u)) ME=u; } })();
render();
cloudInit();
sampleInit();
srvInit();
